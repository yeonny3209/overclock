    for (let i = 0; i < 2; i++) { const s = spot(16); if (s) room.props.push({ type: 'barrel', x: s.x, y: s.y, r: 15, hp: 20, shootable: true }); }
  }
}

// 전투 방 시작
function startRoom(o) {
  const zone = o.zone;
  const kind = o.kind;
  const boss = kind === 'boss';
  const W = boss ? 1500 : Math.round(rand(1500, 1800)), H = boss ? 1000 : Math.round(rand(1000, 1200));
  newRoom(kind, zone, W, H);
  setScaling(zone, 0);
  resetFx();
  const objType = boss ? 'boss' : o.objective;
  if (objType === 'escort') { room.sx = 160; room.sy = H / 2 + 70; }
  if (boss) {
    room.sy = H - 120;
    if (zone === 0) { // 크러셔: 부딪힐 기둥
      for (const [x, y] of [[W * 0.25, H * 0.3], [W * 0.75, H * 0.3], [W * 0.25, H * 0.68], [W * 0.75, H * 0.68]]) room.walls.push({ x: x - 45, y: y - 35, w: 90, h: 70, hp: Infinity, kind: 'block' });
    }
    if (zone === 2) { for (let i = 0; i < 2; i++) addHazard({ type: 'water', x: W * (0.2 + i * 0.6), y: H * 0.5, r: 80 }); }
    if (zone === 0) for (let i = 0; i < 2; i++) addHazard({ type: 'oil', x: W * (0.35 + i * 0.3), y: H * 0.82, r: 70 });
  } else genLayout(objType);
  createPlayer(room.sx, room.sy);
  if (run.char === 'momo') placeTurret(P.x + 40, P.y - 30);
  room.eliteChance = kind === 'elite' ? 0.22 : zone === 0 ? 0 : 0.03 + 0.035 * zone + ((o.row || 0) >= 4 ? 0.03 : 0);
  if (run.oc >= 2) room.eliteChance += 0.06;
  if (run.hard) { room.eliteChance += 0.12; if (zone >= 1) room.muts2 = true; }
  room.muts2 = run.sealedNext || run.oc >= 10; run.sealedNext = false;
  room.extra = (run.alarmNext ? 1.3 : 1) * BS.enemyMult; run.alarmNext = false;
  room.row = o.row || 0;
  if (BS.invest) { run.coins += BS.invest; }
  if (run.allyNext) { room.allies.push({ type: 'robot', x: room.sx + 40, y: room.sy, t: Infinity, cd: 0, ang: -Math.PI / 2, r: 12 }); run.allyNext = false; }
  setupObjective(objType);
  G.screen = 'combat'; G.paused = false; UI('');
  G.objBanner = { t: 2.6 };
  updateCamera(0, true);
}

function setupObjective(type) {
  const ob = room.obj = { type, t: 0 };
  const z = room.zone, W = room.w, H = room.h;
  const base = Math.round((4 + z * 2 + room.row * 0.7) * room.extra);
  switch (type) {
    case 'exterminate':
      ob.waves = z === 0 && room.row === 0 ? 2 : 3; ob.wave = 0; ob.per = base; ob.waveT = 0;
      if (room.kind === 'elite') ob.per = Math.round(base * 1.1);
      break;
    case 'survive': ob.time = 60; ob.spawnT = 1; break;
    case 'defend': {
      ob.time = 50; ob.spawnT = 1.5;
      const g = { type: 'objgen', x: W / 2, y: H / 2, r: 30, hp: 300 + z * 60, maxHp: 300 + z * 60, ally: true };
      room.props.push(g); room.objProp = g;
      break;
    }
    case 'escort': {
      ob.spawnT = 2;
      const d = { type: 'drone', x: 130, y: H / 2, r: 20, hp: 240 + z * 50, maxHp: 240 + z * 50, ally: true };
      room.props.push(d); room.objProp = d;
      room.props.push({ type: 'goal', x: W - 110, y: H / 2, r: 40 });
      break;
    }
    case 'collect':
      ob.got = 0; ob.spawnT = 1.5;
      for (let i = 0; i < 5; i++) {
        const s = freeSpot(14, 300, 80, (x, y) => !room.props.some(p => p.type === 'chip' && d2(p.x, p.y, x, y) < 260 * 260));
        const s2 = s || freeSpot(14, 150, 80);
        if (s2) room.props.push({ type: 'chip', x: s2.x, y: s2.y, r: 14 });
        else ob.got++;
      }
      break;
    case 'bounty': {
      ob.time = 45; ob.spawnT = 3;
      const pool = Object.keys(ZONES[z].spawn).filter(t => t !== 'sturret' && t !== 'summoner');
      const s = freeSpot(30, 600) || { x: W / 2, y: 120 };
      const t = spawnEnemy(pick(pool), s.x, s.y, { muts: rollMuts(z >= 2 ? 2 : 1), hpMult: 1.4 });
      t.bounty = true; ob.target = t;
      break;
    }
    case 'boss': setupBoss(ZONES[z].boss); break;
    case 'arena': ob.wave = 0; ob.state = 'break'; ob.bt = 2; break;
  }
}

// ================= 적 소환 =================
function pickEnemyType() {
  const sp = room.kind === 'arena' ? arenaSpawnTable() : ZONES[room.zone].spawn;
  const turrets = room.enemies.filter(e => e.type === 'sturret' && !e.dead).length;
  let keys = Object.keys(sp);
  if (turrets >= 3) keys = keys.filter(k => k !== 'sturret');
  let t = 0; for (const k of keys) t += sp[k];
  let r = Math.random() * t;
  for (const k of keys) { r -= sp[k]; if (r <= 0) return k; }
  return keys[0];
}
function spawnPos(type) {
  if (type === 'sturret') {
    for (let k = 0; k < 30; k++) {
      const side = randi(0, 3);
      const x = side === 0 ? 50 : side === 1 ? room.w - 50 : rand(60, room.w - 60);
      const y = side === 2 ? 50 : side === 3 ? room.h - 50 : rand(60, room.h - 60);
      if (!wallCircle(x, y, 24) && d2(x, y, P.x, P.y) > 300 * 300) return { x, y };
    }
  }
  for (let k = 0; k < 40; k++) {
    const x = rand(60, room.w - 60), y = rand(60, room.h - 60);
    if (d2(x, y, P.x, P.y) < 320 * 320) continue;
    if (wallCircle(x, y, 26)) continue;
    return { x, y };
  }
  return { x: P.x < room.w / 2 ? room.w - 80 : 80, y: P.y < room.h / 2 ? room.h - 80 : 80 };
}
function spawnOne(type, o = {}) {
  type = type || pickEnemyType();
  const pos = spawnPos(type);
  let muts = null;
  if (o.elite || Math.random() < room.eliteChance) muts = rollMuts(room.muts2 ? 2 : 1);
  return spawnEnemy(type, pos.x, pos.y, { muts, objTarget: o.objTarget });
}
function aliveEnemies() { let n = 0; for (const e of room.enemies) if (!e.dead) n++; return n; }

// ================= 방 갱신 / 목표 =================
function updateRoom(dt) {
  room.t += dt;
  for (let i = room.timers.length - 1; i >= 0; i--) { const t = room.timers[i]; t.t -= dt; if (t.t <= 0) { room.timers.splice(i, 1); t.fn(); } }
  // 정전 구간
  if (room.dark) {
    room.darkT -= dt;
    if (room.darkT <= 0) { room.darkOn = !room.darkOn; room.darkT = room.darkOn ? 6 : 7; if (room.darkOn) { SFX.play('glitch'); floatText(P.x, P.y - 50, '정전!', '#c86bff', 18); } }
  }
  if (G.glitchWarn > 0) { G.glitchWarn -= dt; if (G.glitchWarn <= 0) { G.glitchT = 3; SFX.play('glitch'); } }
  if (G.glitchT > 0) G.glitchT -= dt;
  if (room.done || P.dead) return;
  const ob = room.obj;
  ob.t += dt;
  const alive = aliveEnemies();
  const cap = 22 + room.zone * 3;
  switch (ob.type) {
    case 'exterminate': {
      ob.waveT -= dt;
      if (ob.wave < ob.waves && (ob.wave === 0 || alive <= 2 || ob.waveT <= 0)) {
        if (ob.wave > 0) healRun(run.hard ? 5 : 15, true);
        ob.wave++; ob.waveT = 14;
        const n = ob.per + (ob.wave - 1);
        for (let i = 0; i < n; i++) spawnOne(null, { elite: room.kind === 'elite' && i < (ob.wave === 1 ? 2 : 1) });
        if (ob.wave > 1) G.banner = { text: `웨이브 ${ob.wave}/${ob.waves}`, t: 1, color: '#29f0ff' };
      }
      if (ob.wave >= ob.waves && alive === 0) { healRun(run.hard ? 5 : 15, true); completeRoom(true); }
      break;
    }
    case 'survive':
    case 'defend': {
      ob.time -= dt; ob.spawnT -= dt;
      const k = clamp(ob.t / 60, 0, 1);
      if (ob.spawnT <= 0 && alive < cap) {
        ob.spawnT = lerp(1.8, 0.85, k) / room.extra * (ob.type === 'defend' ? 1.15 : 1);
        const n = randi(1, 2 + (room.zone >= 2 ? 1 : 0));
        for (let i = 0; i < n; i++) spawnOne(null, { objTarget: ob.type === 'defend' && Math.random() < 0.55 });
      }
      if (ob.type === 'defend' && room.objProp.dead) { completeRoom(false); break; }
      if (ob.time <= 0) completeRoom(true);
      break;
    }
    case 'escort':
    case 'collect': {
      ob.spawnT -= dt;
      if (ob.spawnT <= 0 && alive < cap - 6) {
        ob.spawnT = (ob.type === 'escort' ? 2.1 : 2.4) / room.extra;
        const n = randi(1, 2);
        for (let i = 0; i < n; i++) spawnOne(null, { objTarget: ob.type === 'escort' && Math.random() < 0.45 });
      }
      if (ob.type === 'escort' && room.objProp.dead) { completeRoom(false); break; }
      if (ob.type === 'collect' && ob.got >= 5) completeRoom(true);
      break;
    }
    case 'bounty': {
      ob.time -= dt; ob.spawnT -= dt;
      if (ob.spawnT <= 0 && alive < cap - 8) { ob.spawnT = 3.2 / room.extra; spawnOne(); }
      if (ob.target.dead) completeRoom(true);
      else if (ob.time <= 0) {
        burst(ob.target.x, ob.target.y, '#ff3df0', 30, 300, 0.5, 3);
        ob.target.noReward = true; ob.target.dead = true;
        completeRoom(false);
      }
      break;
    }
    case 'boss':
      if (room.bossDead) completeRoom(true);
      break;
    case 'arena': updateArena(dt, alive); break;
  }
}

// 현상금 표적 AI (도망)
function bountyAI(e, dt) {
  const d = dist(e.x, e.y, P.x, P.y), a = angTo(e.x, e.y, P.x, P.y);
  if (d < 340) {
    let fa = a + Math.PI + Math.sin(G.time * 2 + e.x * 0.01) * 0.6;
    const nx = e.x + Math.cos(fa) * 60, ny = e.y + Math.sin(fa) * 60;
    if (nx < 60 || nx > room.w - 60 || ny < 60 || ny > room.h - 60) fa = a + Math.PI / 2 * (e.x > room.w / 2 ? 1 : -1);
    moveToward(e, e.x + Math.cos(fa) * 60, e.y + Math.sin(fa) * 60, e.spd * e.sm * 1.35, dt);
  } else {
    e.t += dt; moveToward(e, e.x + Math.cos(e.t) * 50, e.y + Math.sin(e.t * 0.7) * 50, e.spd * e.sm * 0.6, dt);
  }
  e.ang = a;
  e.cd -= dt * e.atkMult;
  if (e.cd <= 0 && d < 600) { e.cd = 1.8; eFan(e, a, 3, 0.4, 260, 10); }
}

function completeRoom(success) {
  if (room.done) return;
  room.done = true; room.success = success;
  for (const e of room.enemies) if (!e.dead) {
    if (!success) e.noReward = true;
    if (!e.boss) killEnemy(e, {});
  }
  for (const b of BULLETS) if (b.team === 'e') b.dead = true;
  for (const h of room.hazards) if (h.cycle) { h.cycle = null; h.state = 'off'; h.on = false; }
  if (success) {
    G.slowmo = Math.max(G.slowmo, 0.5);
    SFX.play('objective');
    G.banner = { text: '목표 달성!', sub: room.kind === 'arena' ? '' : '출구로 이동하세요', t: 2, color: '#6dff8a' };
    if (BS.regen) healRun(BS.regen, true);
    if (SAVE.settings.autoCoin) room.timers.push({ t: 0.6, fn: collectAllCoins });
    const chestChance = room.kind === 'boss' ? 1 : room.kind === 'elite' ? 0.5 : 0.22 + BS.lucky;
    if (Math.random() < chestChance) {
      const s = freeSpot(18, 0, 60, (x, y) => d2(x, y, P.x, P.y) < 400 * 400 && d2(x, y, P.x, P.y) > 80 * 80) || { x: clamp(P.x + 80, 40, room.w - 40), y: P.y };
      room.props.push({ type: 'chest', x: s.x, y: s.y, r: 18, interact: '[E] 무기 상자 열기' });
    }
  } else {
    SFX.play('lose');
    G.banner = { text: '목표 실패', sub: '보상 없음 · 피해 10', t: 2.2, color: '#ff4d6d' };
    hurtRun(10);
  }
  let ex = room.w / 2, ey = room.h / 2;
  if (wallCircle(ex, ey, 40) || room.props.some(p => d2(p.x, p.y, ex, ey) < 60 * 60)) { const s = freeSpot(36, 0, 80) || { x: P.x, y: P.y }; ex = s.x; ey = s.y; }
  if (room.obj.type === 'escort') { ex = room.w - 110; ey = room.h / 2; }
  room.props.push({ type: 'exit', x: ex, y: ey, r: 36, t: 0 });
}

function leaveRoom() {
  if (room.left) return;
  room.left = true;
  SFX.play('ui');
  room.leaving = true; // 프레임 끝에서 처리

}

function playerDie() {
  if (P.dead) return;
  P.dead = true;
  burst(P.x, P.y, CHARS[run.char].color, 50, 350, 0.9, 4);
  G.slowmo = 1.5; shake(20); SFX.play('lose');
  room.over = true;
  room.timers.push({ t: 1.6, fn: () => { room.ending = true; } });
}

function collectAllCoins() {
  if (!room) return;
  let sum = 0;
  room.pickups = room.pickups.filter(p => { if (p.type === 'coin') { sum += p.val; return false; } return true; });
  if (sum > 0) { run.coins += sum; run.coinsEarned += sum; SFX.play('coin'); floatText(P.x, P.y - 60, `코인 자동 회수 +${sum}`, '#ffe14d', 16); }
}
// ================= 파티클 / 연출 =================
const PARTS = [], PPOOL = [];
function PFX() { return [0.3, 0.6, 1][SAVE.settings.particles]; }
function maxParts() { return [250, 650, 1400][SAVE.settings.particles]; }
function part(o) {
  if (PARTS.length >= maxParts()) return;
  const p = PPOOL.pop() || {};
  p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.life = p.max = o.life || 0.5; p.size = o.size || 3;
  p.color = o.color || '#fff'; p.kind = o.kind || 'dot'; p.rot = o.rot || 0; p.vr = (p.kind === 'shell' || p.kind === 'debris') ? rand(-12, 12) : 0;
  PARTS.push(p);
}
function burst(x, y, color, n, spd, life, size) {
  n = Math.ceil(n * PFX());
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(0.25, 1) * spd; part({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rand(0.6, 1.2), size: size * rand(0.6, 1.3), color, kind: 'dot' }); }
}
function smoke(x, y, n, r) {
  n = Math.ceil(n * PFX());
  for (let i = 0; i < n; i++) part({ x: x + rand(-r / 3, r / 3), y: y + rand(-r / 3, r / 3), vx: rand(-30, 30), vy: rand(-50, -10), life: rand(0.6, 1.2), size: rand(r * 0.2, r * 0.4), color: 'rgba(70,60,60,0.45)', kind: 'smoke' });
}
function fxExplosion(x, y, r) {
  part({ x, y, life: 0.35, size: r, color: '#ffb347', kind: 'ring' });
  part({ x, y, life: 0.12, size: r * 0.8, color: '#fff2c0', kind: 'flash' });
  burst(x, y, '#ff8a2a', 20, r * 3, 0.5, 4); burst(x, y, '#ffe14d', 10, r * 2.2, 0.35, 3); smoke(x, y, 6, r);
  shake(r / 10); SFX.play('explode');
}
function updateParticles(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i];
    p.life -= dt;
    if (p.life <= 0) { PARTS[i] = PARTS[PARTS.length - 1]; PARTS.pop(); PPOOL.push(p); continue; }
    switch (p.kind) {
      case 'dot': p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt); break;
      case 'shell': case 'debris': p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.005, dt); p.vy *= Math.pow(0.005, dt); p.rot += p.vr * dt * (Math.abs(p.vx) + Math.abs(p.vy)) / 100; break;
      case 'smoke': p.x += p.vx * dt; p.y += p.vy * dt; p.size += 12 * dt; break;
    }
  }
}
function addBolt(x1, y1, x2, y2, color, life = 0.12) {
  const d = dist(x1, y1, x2, y2), n = Math.max(2, Math.floor(d / 18)), a = angTo(x1, y1, x2, y2);
  const nx = -Math.sin(a), ny = Math.cos(a), pts = [x1, y1];
  for (let i = 1; i < n; i++) { const k = i / n, o = rand(-12, 12); pts.push(lerp(x1, x2, k) + nx * o, lerp(y1, y2, k) + ny * o); }
  pts.push(x2, y2);
  G.bolts.push({ pts, t: life, max: life, color });
  if (G.bolts.length > 60) G.bolts.shift();
}
function floatText(x, y, text, color, size = 14) {

function render() {
  const Z = ZONES[room.zone];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#030208'; ctx.fillRect(0, 0, VW, VH);
  let sx = 0, sy = 0;
  if (G.shakeAmt > 0.3) { sx = rand(-1, 1) * G.shakeAmt; sy = rand(-1, 1) * G.shakeAmt; }
  ctx.save();
  ctx.translate(Math.round(-cam.x + sx), Math.round(-cam.y + sy));
  drawFloor(Z);
  drawHazards();
  for (const d of room.decals) { ctx.fillStyle = 'rgba(0,0,0,0.28)'; circlePath(d.x, d.y, d.r); ctx.fill(); }
  drawParticles(true);
  drawWalls(Z);
  drawPickups();
  drawProps();
  for (const v of room.vortices) drawVortex(v);
  for (const a of room.allies) drawAlly(a);
  for (const h of room.hacked) { drawEnemy(h); ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * (h.allyT / h.allyMax)); ctx.strokeStyle = '#29f0ff'; ctx.lineWidth = 2; ctx.stroke(); }

  if (P && !P.dead && P.hackCd <= 0) for (const e of room.enemies) if (canHack(e) && onScreen(e.x, e.y, 0)) { ctx.setLineDash([3, 4]); circlePath(e.x, e.y, e.r + 12); ctx.strokeStyle = 'rgba(41,240,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); }
  for (const e of room.enemies) if (!e.boss) drawEnemy(e);
  for (const e of room.enemies) if (e.boss) drawEnemy(e);
  drawPlayer();
  drawBullets();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of G.bolts) {
    ctx.beginPath(); ctx.moveTo(b.pts[0], b.pts[1]);
    for (let i = 2; i < b.pts.length; i += 2) ctx.lineTo(b.pts[i], b.pts[i + 1]);
    const k = b.t / b.max;
    ctx.strokeStyle = b.color; ctx.globalAlpha = 0.35 * k; ctx.lineWidth = 7; ctx.stroke();
    ctx.globalAlpha = k; ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  }
  for (const b of G.beams) {
    const k = b.t / b.max;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2);
    ctx.strokeStyle = b.color; ctx.globalAlpha = 0.35 * k; ctx.lineWidth = b.w * 3; ctx.stroke();
    ctx.globalAlpha = k; ctx.lineWidth = b.w * 0.6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawParticles(false);
  for (const t of G.texts) {
    const k = t.t / t.max;
    ctx.globalAlpha = Math.min(1, k * 2);
    ctx.font = `${t.size}px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawScreenFx();
  drawHUD();
}

function drawFloor(Z) {
  const x0 = Math.max(0, cam.x - 10), y0 = Math.max(0, cam.y - 10), x1 = Math.min(room.w, cam.x + VW + 10), y1 = Math.min(room.h, cam.y + VH + 10);

  for (let y = Math.floor(y0 / gs) * gs; y <= y1; y += gs) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.fillStyle = Z.grid;
  for (let x = Math.floor(x0 / gs) * gs; x <= x1; x += gs) for (let y = Math.floor(y0 / gs) * gs; y <= y1; y += gs) ctx.fillRect(x - 2, y - 2, 4, 4);

function drawWalls(Z) {

const DARK_CACHE = {};
function darken(hex, k = 0.3) {

    const n = parseInt(hex.slice(1, 7), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    DARK_CACHE[key] = `rgb(${Math.round(r * k + 10 * (1 - k))},${Math.round(g * k + 8 * (1 - k))},${Math.round(b * k + 22 * (1 - k))})`;
  }
  return DARK_CACHE[key];
}

  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y, w * clamp(frac, 0, 1), h);

function drawBullets() {

    switch (b.type) {

        circlePath(b.x, b.y, b.r); ctx.fillStyle = `rgba(80,150,255,${0.3 * k + 0.1})`; ctx.fill();

        g.addColorStop(0.7, `rgba(255,90,20,${0.15 + 0.35 * k})`);

        ctx.fillStyle = b.color; ctx.fillRect(-b.r, -1.5, b.r * 2, 3); ctx.restore();
        break;
      case 'grenade': case 'bh':
        circlePath(b.x, b.y, b.r * 2); ctx.fillStyle = b.color; ctx.globalAlpha = 0.25; ctx.fill(); ctx.globalAlpha = 1;
        circlePath(b.x, b.y, b.r); ctx.fillStyle = b.color; ctx.fill();

function drawParticles(ground) {
  for (const p of PARTS) {
    const g = p.kind === 'shell' || p.kind === 'debris';
    if (g !== ground) continue;
    const k = p.life / p.max;
    switch (p.kind) {
      case 'dot':
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, k * 1.5);
        ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        break;
      case 'smoke':
        ctx.globalAlpha = k * 0.8; circlePath(p.x, p.y, p.size); ctx.fillStyle = p.color; ctx.fill();
        break;
      case 'shell': case 'debris':
        ctx.globalAlpha = Math.min(1, k * 3);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        if (p.kind === 'shell') ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size); else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);

        break;
      case 'flash':
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k;
        circlePath(p.x, p.y, p.size); ctx.fillStyle = p.color; ctx.fill();
        break;
      case 'ring':
        ctx.globalAlpha = k; circlePath(p.x, p.y, p.size * (0.3 + 0.7 * (1 - k)));
        ctx.strokeStyle = p.color; ctx.lineWidth = 2 + 4 * k; ctx.stroke();
        break;
      case 'ghost':
        ctx.globalAlpha = k * 0.4; circlePath(p.x, p.y, p.size); ctx.fillStyle = p.color; ctx.fill();
        break;
      case 'arc':
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.7 + 0.3 * (1 - k)), p.rot - 1.05, p.rot + 1.05);
        ctx.strokeStyle = p.color; ctx.lineWidth = 18 * k + 2; ctx.stroke();

}

  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(${G.flashColor},${Math.min(0.45, G.flash)})`; ctx.fillRect(0, 0, VW, VH); }
  // 저체력 비네트
  if (run.hp < run.maxHp * 0.3 && !P.dead) {
    const a = 0.25 + Math.sin(G.time * 5) * 0.12;
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);

    ctx.strokeStyle = `hsla(${hue},100%,60%,0.25)`; ctx.lineWidth = 24; ctx.strokeRect(12, 12, VW - 24, VH - 24);
  }
  if (P.slowT > 0) { ctx.fillStyle = 'rgba(120,80,200,0.08)'; ctx.fillRect(0, 0, VW, VH); }
  if (P.odT > 0) {
    const k = 0.5 + Math.sin(G.time * 12) * 0.25;
    ctx.strokeStyle = `rgba(255,61,240,${k})`; ctx.lineWidth = 10; ctx.strokeRect(5, 5, VW - 10, VH - 10);
    ctx.fillStyle = 'rgba(255,61,240,0.05)'; ctx.fillRect(0, 0, VW, VH);

}

// ================= HUD =================
function hudText(t, x, y, size, color, align = 'left', font = FONT) {
  ctx.font = `${size}px ${font}`; ctx.textAlign = align;
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(t, x, y);
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function panel(x, y, w, h, border = 'rgba(41,240,255,0.35)') {
  ctx.fillStyle = 'rgba(6,5,16,0.72)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function drawHUD() {
  const pad = 16;
  // 오버클럭 게이지 + 해킹 대기
  {
    const gy = pad + 78, od = run.od || 0, full = od >= 100;

    ctx.fillStyle = '#2a0f2e'; ctx.fillRect(pad + 6, gy + 6, 140, 10);

    ctx.fillRect(pad + 6, gy + 6, 140 * (P.odT > 0 ? P.odT / 8 : od / 100), 10);
    hudText(P.odT > 0 ? `OC ${P.odT.toFixed(1)}s` : full ? 'OC 준비 [F]' : `OC ${Math.floor(od)}%`, pad + 152, gy + 16, 11, full || P.odT > 0 ? '#ff3df0' : '#8a90b0');
    hudText(P.hackCd > 0 ? `해킹 ${Math.ceil(P.hackCd)}` : '해킹 OK', pad + 284, gy + 16, 10, P.hackCd > 0 ? '#5a6080' : '#29f0ff', 'right');
  }
  // 체력
  panel(pad, pad, 290, 74);
  const hpF = run.hp / run.maxHp;
  ctx.fillStyle = '#300b18'; ctx.fillRect(pad + 10, pad + 10, 270, 18);
  const g = ctx.createLinearGradient(pad + 10, 0, pad + 280, 0); g.addColorStop(0, '#ff2d55'); g.addColorStop(1, '#ff8a9a');
  ctx.fillStyle = g; ctx.fillRect(pad + 10, pad + 10, 270 * clamp(hpF, 0, 1), 18);
  hudText(`${Math.ceil(run.hp)} / ${run.maxHp}`, pad + 145, pad + 24, 14, '#fff', 'center');
  for (let i = 0; i < P.shield; i++) { ctx.fillStyle = '#6dff8a'; ctx.fillRect(pad + 10 + i * 14, pad + 31, 10, 4); }
  // 스킬
  const c = CHARS[run.char];
  const sx = pad + 10, sy = pad + 38, sz = 30;
  ctx.fillStyle = '#0d0a1c'; ctx.fillRect(sx, sy, sz, sz);

  if (P.skillCd > 0) {

    ctx.arc(sx + sz / 2, sy + sz / 2, sz * 0.72, -Math.PI / 2, -Math.PI / 2 + TAU * (P.skillCd / P.skillMax)); ctx.closePath();
    ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sz, sz); ctx.clip(); ctx.fill(); ctx.restore();
    hudText(Math.ceil(P.skillCd), sx + sz / 2, sy + 21, 14, '#fff', 'center');
  } else hudText('RMB', sx + sz / 2, sy + 20, 11, c.color, 'center');
  hudText(c.skill, sx + sz + 8, sy + 13, 13, c.color);
  const act = P.overT > 0 ? `과충전 ${P.overT.toFixed(1)}s` : P.slowT > 0 ? `감속 ${P.slowT.toFixed(1)}s` : '';
  hudText(act || '구르기', sx + sz + 8, sy + 28, 11, act ? '#fff' : '#8a90b0');

  if (BS.berserk && run.berserk) hudText(`광전사 +${Math.min(90, run.berserk * 3)}%`, pad + 190, sy + 13, 11, '#ff4d6d');

  // 우상단: 코인, 위치, 콤보

  hudText(loc, rx - 188, pad + 26, 12, '#8a90b0');
  if (run.combo > 0) {
    const gr = comboGrade(run.combo);
    hudText(`${run.combo} 콤보`, rx - 188, pad + 56, 16, '#fff');
    if (gr) hudText(gr, rx - 16, pad + 62, 30, gr === 'S' ? `hsl(${(G.time * 200) % 360},100%,65%)` : '#ffe14d', 'right');
    ctx.fillStyle = '#2a3050'; ctx.fillRect(rx - 188, pad + 62, 130, 4);
    ctx.fillStyle = '#29f0ff'; ctx.fillRect(rx - 188, pad + 62, 130 * clamp(run.comboT / BS.comboTime, 0, 1), 4);
  } else hudText('콤보 없음', rx - 188, pad + 56, 12, '#5a6080');

  // 무기 슬롯 (우하단)
  for (let i = 0; i < 2; i++) {

    const T = Input.touch, bw = T ? 170 : 210, bh = T ? 40 : 58, bx = VW - pad - bw, by = T ? pad + 80 + i * 46 : VH - pad - bh - (i === 0 ? bh + 8 : 0);

    ctx.fillStyle = TAG_COLOR[s.tag]; ctx.fillRect(bx + 12, by + (T ? 24 : 30), 30, 4);

    const ammo = s.mag === Infinity ? '∞' : w.reloadT > 0 ? '재장전' : `${w.ammo}/${s.mag}`;
    hudText(ammo, bx + bw - 10, by + (T ? 30 : 42), w.reloadT > 0 ? 13 : T ? 17 : 22, w.ammo <= 0 && s.mag !== Infinity ? '#ff4d6d' : '#fff', 'right');
    if (cur && w.reloadT > 0) { ctx.fillStyle = '#29f0ff'; ctx.fillRect(bx, by + bh - 3, bw * (1 - w.reloadT / (w.reloadMax || 1)), 3); }
    if (!T) hudText(i === run.cur ? '' : 'Q', bx + bw - 12, by + 18, 11, '#8a90b0', 'right');
    ctx.globalAlpha = 1;
  }
  // 태그 (좌하단, 폭이 모자라면 줄바꿈)

  const chips = [];
  for (const t of SET_TAGS) {
    const n = run.tags[t]; if (!n) continue;
    const lbl = `${TAG_NAME[t]} ${n}${n >= 9 ? ' ◆' : n >= 7 ? ' ★★★' : n >= 5 ? ' ★★' : n >= 3 ? ' ★' : ''}`;
    ctx.font = `12px ${FONT}`;
    chips.push({ t, n, lbl, w: ctx.measureText(lbl).width + 14 });
  }
  let rows = [[]], rw = 0;
  for (const c of chips) { if (rw + c.w > maxX - pad && rows[rows.length - 1].length) { rows.push([]); rw = 0; } rows[rows.length - 1].push(c); rw += c.w + 6; }
  rows = rows.filter(r => r.length);
  let ty = Input.touch ? pad + 146 : VH - pad - 6 - (rows.length - 1) * 26;
  for (const r of rows) {

    for (const c of r) {

function drawObjectiveHUD() {
  const ob = room.obj; if (!ob) return;
  let t = '', col = '#29f0ff', bar = null;
  if (room.done) { t = room.success ? '목표 달성 — 출구로 이동 ▶' : '목표 실패 — 출구로 이동 ▶'; col = room.success ? '#6dff8a' : '#ff4d6d'; }
  else switch (ob.type) {
    case 'exterminate': t = `섬멸 — 웨이브 ${ob.wave}/${ob.waves} · 남은 적 ${aliveEnemies()}`; break;
    case 'survive': t = `생존 — ${Math.ceil(ob.time)}초`; bar = [1 - ob.time / 60, '#29f0ff']; break;
    case 'defend': t = `거점 사수 — ${Math.ceil(ob.time)}초`; bar = [room.objProp.hp / room.objProp.maxHp, '#6dff8a']; break;
    case 'escort': { const p = room.objProp; t = `호위 — 진행 ${Math.floor(clamp((p.x - 130) / (room.w - 260), 0, 1) * 100)}%${p.blocked ? ' · 적이 길을 막고 있다!' : ''}`; bar = [p.hp / p.maxHp, '#29f0ff']; break; }
    case 'collect': t = `수집 — 데이터칩 ${ob.got}/5`; break;
    case 'bounty': t = `현상금 — 표적 처치까지 ${Math.ceil(ob.time)}초`; col = '#ff3df0'; break;
    case 'boss': t = BOSS_INFO[room.bossId].desc; col = '#ff3df0'; break;
    case 'arena': t = ob.state === 'break' ? `다음 웨이브 ${Math.ceil(ob.bt)}초` : `무한 아레나 — 웨이브 ${ob.wave} · 남은 적 ${aliveEnemies() + (ob.left || 0)}`; break;
  }
  ctx.font = `15px ${FONT}`; const w = Math.max(260, ctx.measureText(t).width + 40);
  const oy = hudTopY();
  panel(VW / 2 - w / 2, oy, w, bar ? 44 : 34, col);
  hudText(t, VW / 2, oy + 23, 15, col, 'center');
  if (bar) { ctx.fillStyle = '#1a1830'; ctx.fillRect(VW / 2 - w / 2 + 10, oy + 34, w - 20, 5); ctx.fillStyle = bar[1]; ctx.fillRect(VW / 2 - w / 2 + 10, oy + 34, (w - 20) * clamp(bar[0], 0, 1), 5); }
}

function drawBossBar() {
  const bosses = room.enemies.filter(e => e.boss && !e.dead);
  if (!bosses.length || G.bossIntro) return;
  const n = bosses.length, bw = Math.min(560, VW - 80) / n - (n > 1 ? 10 : 0);
  bosses.forEach((b, i) => {
    const x = VW / 2 - (bw * n + (n - 1) * 10) / 2 + i * (bw + 10), y = hudTopY() + 56;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x - 2, y - 2, bw + 4, 16);
    ctx.fillStyle = b.invuln ? '#555a70' : b.color; ctx.fillRect(x, y, bw * clamp(b.hp / b.maxHp, 0, 1), 12);
    if (b.bossId === 'mother') for (let k = 1; k < 3; k++) { ctx.fillStyle = '#000'; ctx.fillRect(x + bw * k / 3 - 1, y, 2, 12); }
    hudText(b.name + (b.invuln ? ' (무적)' : b.dmgTakenMult > 1 ? ' (약점!)' : ''), x + bw / 2, y + 30, 13, '#fff', 'center');
  });
}

function drawOffscreenArrows() {
  const tg = [];
  const ob = room.obj;
  if (ob && ob.type === 'bounty' && ob.target && !ob.target.dead) tg.push([ob.target, '#ff3df0']);
  for (const p of room.props) {
    if (p.type === 'chip' && !p.dead) tg.push([p, '#29f0ff']);
    if (p.type === 'exit') tg.push([p, '#6dff8a']);
    if ((p.type === 'drone' || p.type === 'objgen') && !p.dead) tg.push([p, '#6dff8a']);
    if (p.type === 'heater' && !p.on) tg.push([p, '#ff8a2a']);
    if (p.type === 'spillar' && !p.dead) tg.push([p, '#c86bff']);
    if (p.type === 'chest') tg.push([p, '#ffb52e']);
  }
  for (const [o, c] of tg) {
    const sx = o.x - cam.x, sy = o.y - cam.y;
    if (sx > 20 && sx < VW - 20 && sy > 20 && sy < VH - 20) continue;
    const a = Math.atan2(sy - VH / 2, sx - VW / 2);
    const m = 40, ex = clamp(sx, m, VW - m), ey = clamp(sy, m + 50, VH - m);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9); ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.restore();
  }
}

function drawCrosshair() {
  if (Input.usingPad || Input.touch) return;
  const x = Input.mx, y = Input.my, w = curW();
  const s = wStats(w);
  const spread = 8 + s.spread * 60;
  ctx.strokeStyle = '#29f0ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - spread - 6, y); ctx.lineTo(x - spread, y); ctx.moveTo(x + spread, y); ctx.lineTo(x + spread + 6, y);
  ctx.moveTo(x, y - spread - 6); ctx.lineTo(x, y - spread); ctx.moveTo(x, y + spread); ctx.lineTo(x, y + spread + 6);
  ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  if (w.reloadT > 0) { ctx.beginPath(); ctx.arc(x, y, spread + 12, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - w.reloadT / (w.reloadMax || 1))); ctx.strokeStyle = '#ffe14d'; ctx.stroke(); }
  if (s.mag !== Infinity && w.ammo <= Math.ceil(s.mag * 0.2) && w.reloadT <= 0) hudText(w.ammo <= 0 ? 'R 재장전' : '탄약 부족', x, y + spread + 24, 11, '#ff4d6d', 'center');
}

// ================= 메뉴 배경 =================
let menuT = 0;
const menuStars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 2 + 0.5, v: Math.random() * 0.02 + 0.005 }));
function renderMenuBG(dt) {

  ctx.fillStyle = '#0a0514';
  let bx = 0; let seed = 7;
  while (bx < VW) { seed = (seed * 9301 + 49297) % 233280; const bw = 30 + (seed % 70), bh = 40 + (seed % 140); ctx.fillRect(bx, hz - bh, bw, bh); bx += bw + 4; }
  // 격자 바닥
  ctx.strokeStyle = 'rgba(255,61,240,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = -20; i <= 20; i++) { ctx.moveTo(VW / 2 + i * 40, hz); ctx.lineTo(VW / 2 + i * 260, VH); }
  const off = (menuT * 0.6) % 1;
  for (let i = 0; i < 14; i++) { const k = Math.pow((i + off) / 14, 2.2); const y = hz + k * (VH - hz); ctx.moveTo(0, y); ctx.lineTo(VW, y); }
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (const s of menuStars) { s.y -= s.v * dt * 0.5; if (s.y < 0) s.y = 0.55; ctx.globalAlpha = 0.5 + Math.sin(menuT * 3 + s.x * 10) * 0.3; ctx.fillRect(s.x * VW, s.y * hz, s.s, s.s); }
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  const mw = Math.min(170, VW * 0.2), k = mw / room.w, mh = room.h * k;
  const x0 = VW - 16 - mw, y0 = Input.touch ? 16 + 80 + 94 : 16 + 80;
  ctx.fillStyle = 'rgba(6,5,16,0.7)'; ctx.fillRect(x0, y0, mw, mh);
  ctx.strokeStyle = 'rgba(41,240,255,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, mw - 1, mh - 1);
  ctx.fillStyle = 'rgba(160,160,200,0.35)';
  for (const w of room.walls) ctx.fillRect(x0 + w.x * k, y0 + w.y * k, Math.max(1, w.w * k), Math.max(1, w.h * k));
  const dot = (x, y, c, s) => { ctx.fillStyle = c; ctx.fillRect(x0 + x * k - s / 2, y0 + y * k - s / 2, s, s); };
  for (const p of room.props) {
    if (p.type === 'exit') dot(p.x, p.y, '#6dff8a', 6);
    else if (p.type === 'chip' && !p.dead) dot(p.x, p.y, '#29f0ff', 4);
    else if (p.type === 'chest') dot(p.x, p.y, '#ffb52e', 5);
    else if ((p.type === 'drone' || p.type === 'objgen') && !p.dead) dot(p.x, p.y, '#6dff8a', 5);
  }
  for (const e of room.enemies) if (!e.dead) dot(e.x, e.y, e.boss ? '#ff3df0' : e.muts || e.bounty ? '#ffb52e' : '#ff4d6d', e.boss ? 6 : 3);
  for (const h of room.hacked) dot(h.x, h.y, '#29f0ff', 3);
  if (!room.darkOn) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.strokeRect(x0 + cam.x * k, y0 + cam.y * k, VW * k, VH * k);
  }
  dot(P.x, P.y, '#ffffff', 5);
}

function advanceRadio() {
  const st = radioState; if (!st) return;
  const txt = st.lines[st.i];
  if (st.ch < txt.length) { st.ch = txt.length; clearInterval(st.timer); st.el.innerHTML = esc(txt).replace(/^(\[[^\]]+\])/, '<b style="color:#29f0ff">$1</b>'); return; }

}

// ================= 강화 선택 =================
function genUpgradeChoices(count, rare) {
  let pool = upgradePool().filter(u => (run.ups[u.id] || 0) < (u.max || 1));
  const out = [];
  const take = list => { if (!list.length) return null; const u = rweighted(list, upgWeight); pool = pool.filter(p => p !== u); out.push(u); return u; };
  let guaranteed = null;
  if (rare) guaranteed = take(pool.filter(u => u.rare));
  // 현재 빌드와 같은 태그 보정: 1개 보장, 3개 이상 모았으면 50% 확률로 1개 더
  const top = SET_TAGS.filter(t => run.tags[t]).sort((a, b) => run.tags[b] - run.tags[a])[0];
  if (top && !out.some(u => u.tag === top)) take(pool.filter(u => u.tag === top));
  if (top && run.tags[top] >= 3 && out.length < count && RNG() < 0.5) take(pool.filter(u => u.tag === top));
  while (out.length < count && pool.length) take(pool);
  rshuffle(out);
  const choices = out.map(u => ({ kind: 'up', u }));
  const curses = CURSES.filter(c => !run.curses[c.id]);
  if (choices.length >= 3 && curses.length && RNG() < 0.2) {
    const idx = choices.findIndex(ch => ch.u !== guaranteed && (!top || ch.u.tag !== top));
    if (idx >= 0) choices[idx] = { kind: 'curse', c: rp(curses) };
  }
  return choices;
}
function openUpgradePick(opts, done) {
  const prevScreen = opts._prev || G.screen;
  if (G.screen === 'combat') G.screen = 'overlay';
  const choices = genUpgradeChoices(opts.count || 3, opts.rare);
  const finish = () => { if (prevScreen === 'combat') { G.screen = 'combat'; UI(''); } done && done(); };
  if (!choices.length) { finish(); return; }
  const cards = choices.map(ch => {
    if (ch.kind === 'curse') {
      const c = ch.c;
      return `<div class="card curse" onclick="${cb(() => { applyCurse(c.id); SFX.play('glitch'); finish(); })}">
        <span class="rib" style="color:#ff2d55">저주</span><h3 style="color:#ff4d6d">${c.name}</h3>
        <p style="color:#6dff8a">▲ ${c.gain}</p><p style="color:#ff4d6d">▼ ${c.cost}</p></div>`;
    }
    const u = ch.u, have = run.ups[u.id] || 0, n = (run.tags[u.tag] || 0) + 1;
    const setHint = SETS[u.tag] ? (n === 3 ? `<p style="color:${TAG_COLOR[u.tag]};margin-top:6px">★ 3세트 발동: ${SETS[u.tag][0]}</p>` : n === 5 ? `<p style="color:${TAG_COLOR[u.tag]};margin-top:6px">★★ 5세트 발동: ${SETS[u.tag][1]}</p>` : n === 7 ? `<p style="color:${TAG_COLOR[u.tag]};margin-top:6px">★★★ 7세트 발동: ${SETS[u.tag][2]}</p>` : n === 9 ? `<p style="color:#ff3df0;margin-top:6px">◆ 프리즘 각성: ${SETS[u.tag][3]}</p>` : `<p class="muted small" style="margin-top:6px">${TAG_NAME[u.tag]} 태그 ${n}개째</p>`) : '';
    return `<div class="card ${u.rare ? 'legend' : ''}" onclick="${cb(() => { addUpgrade(u.id); SFX.play('pick'); finish(); })}">

      ${u.max > 1 ? `<p class="muted small">보유 ${have}/${u.max}</p>` : ''}${setHint}</div>`;
  }).join('');
  scr(`${topbar()}<h2>${opts.title || '강화 선택'}</h2><div class="sub">${opts.sub || (opts.rare ? '희귀 강화 포함' : '하나를 골라 빌드를 완성하라')}</div>

    </div>`, prevScreen === 'combat' ? 'clear' : '');

function offerWeapon(w, done) {
  codex('weapon', w.id);
  if (run.weapons.length < 2) { run.weapons.push(w); toast(`무기 획득: <span style="color:${GRADES[w.grade].color}">${esc(weaponName(w))}</span>`); done(); return; }
  const replace = i => {
    const old = run.weapons[i];
    for (const m of old.mods) if (m) run.bag.push(m);
    run.weapons[i] = w; run.cur = i; done();
  };
  scr(`${topbar()}<h2>새 무기 획득</h2><div class="sub">무기는 최대 2개까지 소지할 수 있다. 교체된 무기의 부품은 가방으로 돌아간다.</div>
    <div class="row">${weaponCard(w, '<p style="color:#ffe14d;margin-top:6px">▲ 새 무기</p>')}</div>
    <div class="row" style="margin-top:10px">${run.weapons.map((o, i) => weaponCard(o, `<button class="btn sm ye" style="margin-top:8px;width:100%" onclick="${cb(() => replace(i))}">이 무기와 교체</button>`)).join('')}</div>
    <button class="btn rd" onclick="${cb(done)}">새 무기를 버린다</button>`, 'top');
}
function offerMod(id, done) {
  run.bag.push(id);
  const slots = [];
  run.weapons.forEach((w, wi) => w.mods.forEach((m, si) => { if (!m) slots.push([wi, si]); }));
  if (!slots.length) { toast(`부품 획득: ${MODS[id].name} (가방에 보관)`); done(); return; }
  const install = (wi, si) => { run.weapons[wi].mods[si] = id; run.bag.splice(run.bag.lastIndexOf(id), 1); fixAmmo(run.weapons[wi]); SFX.play('pick'); done(); };
  scr(`${topbar()}<h2>개조 부품: ${MODS[id].name}</h2><div class="sub">${MODS[id].desc}<br>빈 슬롯에 바로 장착하거나 가방에 보관한다. (교체는 정비소에서)</div>
    <div class="row">${slots.map(([wi, si]) => `<button class="btn ye" onclick="${cb(() => install(wi, si))}">${esc(weaponName(run.weapons[wi]))} · 슬롯 ${si + 1}</button>`).join('')}</div>
    <button class="btn" onclick="${cb(done)}">가방에 보관</button>`);
}
function fixAmmo(w) { const s = wStats(w); if (s.mag !== Infinity) w.ammo = Math.min(w.ammo, s.mag); if (w.ammo <= 0 || !isFinite(w.ammo)) w.ammo = s.mag; }

function priceMult() { return (1 + 0.15 * run.zone) * (run.char === 'momo' ? 0.75 : 1) * (run.oc >= 3 ? 1.2 : 1); }
function genShop() {
  const pm = priceMult();
  const items = [];
  for (let i = 0; i < 2; i++) { const w = makeWeapon(randomWeaponId(), rollGrade([55, 35, 10])); items.push({ kind: 'weapon', w, price: Math.round([45, 80, 130][w.grade] * pm) }); }
  const mods = rshuffle(MOD_IDS.slice()).slice(0, 2);
  for (const m of mods) items.push({ kind: 'mod', id: m, price: Math.round(45 * pm) });
  items.push({ kind: 'heal', amt: 30, price: Math.round(35 * pm) });
  const ups = upgradePool().filter(u => (run.ups[u.id] || 0) < (u.max || 1));
  if (ups.length) items.push({ kind: 'upgrade', id: rweighted(ups, upgWeight).id, price: Math.round(80 * pm) });
  return items;
}
function showShop() {
  menuMode();
  const key = `${run.zone}-${run.row}-${run.col}`;
  if (!run.shop || run.shop.key !== key) run.shop = { key, items: genShop(), rerolled: false };
  const sh = run.shop;
  const buy = it => {
    if (run.coins < it.price || it.sold) return;
    run.coins -= it.price; it.sold = true; SFX.play('coin');
    if (it.kind === 'weapon') offerWeapon(it.w, showShop);
    else if (it.kind === 'mod') offerMod(it.id, showShop);
    else if (it.kind === 'heal') { healRun(it.amt); showShop(); }
    else if (it.kind === 'upgrade') { if ((run.ups[it.id] || 0) < (UPG[it.id].max || 1)) addUpgrade(it.id); showShop(); }
  };
  const cards = sh.items.map(it => {
    let body = '';
    if (it.kind === 'weapon') body = `<span class="rib" style="color:${GRADES[it.w.grade].color}">${GRADES[it.w.grade].name}</span><h3 style="color:${GRADES[it.w.grade].color}">${esc(it.w.grade === 2 ? LEGEND[it.w.id].name : WEAPONS[it.w.id].name)}</h3><p>${tagHTML(WEAPONS[it.w.id].tag)} ${WEAPONS[it.w.id].desc}</p>${it.w.bonus ? `<p style="color:#4db8ff">${RARE_BONUS[it.w.bonus]}</p>` : ''}${it.w.grade === 2 ? `<p style="color:#ffb52e">${LEGEND[it.w.id].desc}</p>` : ''}`;
    if (it.kind === 'mod') body = `<span class="rib" style="color:#29f0ff">개조 부품</span><h3>${MODS[it.id].name}</h3><p>${MODS[it.id].desc}</p>`;
    if (it.kind === 'heal') body = `<span class="rib" style="color:#6dff8a">회복</span><h3>수리 키트</h3><p>체력 ${it.amt} 회복${BS.noHeal ? '<br><span style="color:#ff4d6d">광전사: 회복 불가</span>' : ''}</p>`;
    if (it.kind === 'upgrade') { const u = UPG[it.id]; body = `<span class="rib" style="color:#c77dff">강화</span><div>${tagHTML(u.tag)}</div><h3 style="margin-top:4px">${u.name}</h3><p>${u.desc}</p>`; }
    const maxed = it.kind === 'upgrade' && (run.ups[it.id] || 0) >= (UPG[it.id].max || 1);
    const can = !it.sold && !maxed && run.coins >= it.price && !(it.kind === 'heal' && (BS.noHeal || run.hp >= run.maxHp));
    return `<div class="card ${it.kind === 'weapon' && it.w.grade === 2 ? 'legend' : it.kind === 'weapon' && it.w.grade === 1 ? 'rare' : ''} ${it.sold ? 'locked' : ''}" style="cursor:default">${body}
      <button class="btn sm ye" style="width:100%;margin:10px 0 0" ${can ? '' : 'disabled'} onclick="${cb(() => buy(it))}">${it.sold ? '판매 완료' : `◆ ${it.price}`}</button></div>`;
  }).join('');
  const reroll = SAVE.unlocks.qol_reroll && !sh.rerolled ? `<button class="btn sm mg" onclick="${cb(() => { sh.items = genShop(); sh.rerolled = true; showShop(); })}">새로고침 (무료 1회)</button>` : '';
  scr(`${topbar()}<h2>상점</h2><div class="sub">"뭐든 코인만 있으면 되지." ${run.char === 'momo' ? '<span style="color:#ffd23d">(모모 할인 -25%)</span>' : ''}</div>
    <div class="row">${cards}</div>
    <div class="row" style="margin-top:12px">${reroll}<button class="btn" onclick="${cb(showMap)}">떠나기</button></div>`, 'top');
}

  const opts = [0, 1].map(i => {

    return `<button class="btn ye" ${ok ? '' : 'disabled'} onclick="${cb(() => fuseWeapons(i))}">${esc(weaponName(base))} ← ${esc(weaponName(mat))}${t ? ` (${TAG_NAME[t]})` : ''}</button>`;

function fuseWeapons(i) {
  const base = run.weapons[i], mat = run.weapons[1 - i], t = fuseTagOf(mat);

}

// ================= 터치 조작 (휴대폰 / 태블릿) =================
// 왼쪽: 이동 스틱 · 오른쪽: 조준 스틱(당기면 사격) · 화면 버튼: 구르기, 스킬, 오버클럭, 교체, 상호작용, 재장전, 일시정지
// 조준 스틱을 놓고 있으면 가장 가까운 적을 자동 조준하고 자동 사격한다 (설정에서 끌 수 있음).
const TouchCtl = { move: null, aim: null, held: {} };
Input.tmx = 0; Input.tmy = 0; Input.touch = false; Input.touchFire = false; Input.touchAuto = false;

function touchButtons() {
  const R = clamp(Math.min(VW, VH) * 0.085, 30, 52);
  const rx = VW - R * 1.35 - 8, by = VH - R * 1.35 - 8;
  return [
    { id: 'skill', label: '스킬', x: rx, y: by, r: R * 1.1, mp: 2 },
    { id: 'roll', label: '구르기', x: rx - R * 2.6, y: by + R * 0.15, r: R, key: 'Space' },
    { id: 'use', label: 'E', x: rx - R * 4.7, y: by + R * 0.35, r: R * 0.72, key: 'KeyE' },
    // 발사 버튼: 누르고 있으면 자동 조준해서 계속 쏜다 (적이 없으면 히터·서버 기둥 같은 부술 수 있는 사물을 조준)
    { id: 'fire', label: '발사', x: rx - R * 1.1, y: by - R * 2.4, r: R * 1.25 },
    { id: 'od', label: 'OC', x: rx - R * 3.5, y: by - R * 2.5, r: R * 0.8, key: 'KeyF' },
    { id: 'swap', label: '교체', x: rx - R * 5.3, y: by - R * 1.6, r: R * 0.7, key: 'KeyQ' },
    { id: 'reload', label: 'R', x: rx - R * 6.4, y: by - R * 0.3, r: R * 0.6, key: 'KeyR' },
    { id: 'pause', label: 'Ⅱ', x: 330, y: 30, r: 22 }
  ];
}
function touchHit(x, y) { return touchButtons().find(b => d2(x, y, b.x, b.y) < (b.r + 6) ** 2); }
function touchActive() { return G.screen === 'combat' && !G.paused && room && P; }

function initTouch() {
  const opts = { passive: false };
  canvas.addEventListener('touchstart', e => {
    SFX.init();
    Input.touch = true; Input.usingPad = false;
    if (!touchActive()) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY, b = touchHit(x, y);
      if (b) {
        TouchCtl.held[t.identifier] = b.id;
        if (b.id === 'pause') { pauseGame(); continue; }
        if (b.key) Input.pressed[b.key] = 1;
        if (b.mp) Input.mp[b.mp] = 1;
        continue;
      }
      if (x < VW * 0.45 && !TouchCtl.move) TouchCtl.move = { id: t.identifier, ox: x, oy: y, x, y };
      else if (!TouchCtl.aim) TouchCtl.aim = { id: t.identifier, ox: x, oy: y, x, y };
    }
  }, opts);
  canvas.addEventListener('touchmove', e => {
    if (!touchActive()) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (TouchCtl.move && TouchCtl.move.id === t.identifier) { TouchCtl.move.x = t.clientX; TouchCtl.move.y = t.clientY; }
      if (TouchCtl.aim && TouchCtl.aim.id === t.identifier) { TouchCtl.aim.x = t.clientX; TouchCtl.aim.y = t.clientY; }
    }
  }, opts);
  const end = e => {
    for (const t of e.changedTouches) {
      if (TouchCtl.move && TouchCtl.move.id === t.identifier) TouchCtl.move = null;
      if (TouchCtl.aim && TouchCtl.aim.id === t.identifier) TouchCtl.aim = null;
      delete TouchCtl.held[t.identifier];
    }
  };
  canvas.addEventListener('touchend', end, opts);
  canvas.addEventListener('touchcancel', end, opts);
}

// 매 프레임: 스틱 값을 입력으로 변환 (updatePlayer 전에 호출)
function updateTouchInput() {
  Input.tmx = 0; Input.tmy = 0; Input.touchFire = false; Input.touchAuto = false;
  if (!Input.touch || !touchActive()) { TouchCtl.move = TouchCtl.move && touchActive() ? TouchCtl.move : null; return; }
  const R = 60;
  if (TouchCtl.move) {
    let dx = TouchCtl.move.x - TouchCtl.move.ox, dy = TouchCtl.move.y - TouchCtl.move.oy;
    const l = Math.hypot(dx, dy);
    if (l > R) { TouchCtl.move.ox = TouchCtl.move.x - dx / l * R; TouchCtl.move.oy = TouchCtl.move.y - dy / l * R; dx = dx / l * R; dy = dy / l * R; }
    if (l > 8) { Input.tmx = dx / R; Input.tmy = dy / R; }
  }
  const fireHeld = Object.values(TouchCtl.held).includes('fire');
  if (TouchCtl.aim) {
    const dx = TouchCtl.aim.x - TouchCtl.aim.ox, dy = TouchCtl.aim.y - TouchCtl.aim.oy;
    if (Math.hypot(dx, dy) > 14) { P.ang = Math.atan2(dy, dx); Input.touchFire = true; }
  } else {
    // 자동 조준: 조준 스틱을 쓰지 않으면 가장 가까운 목표 (적, 보스 보호막이 켜져 있으면 히터·서버 기둥)
    const t = touchTarget(fireHeld);
    if (t) {
      P.ang = angTo(P.x, P.y, t.x, t.y);
      // 사물은 발사 버튼을 누를 때만 쏜다 (드럼통을 멋대로 터뜨리지 않도록)
      if (t.isEnemy || fireHeld) Input.touchAuto = SAVE.settings.touchAutoFire !== false;
    } else if (Math.hypot(Input.tmx, Input.tmy) > 0.2) P.ang = Math.atan2(Input.tmy, Input.tmx);

// 발사 버튼과 자동 조준이 노리는 목표
function nearestShootableProp(filter, range) {
  let best = null, bd = range * range;
  for (const p of room.props) {
    if (!p.shootable || p.dead || !filter(p)) continue;
    const dd = d2(P.x, P.y, p.x, p.y); if (dd > bd) continue;
    if (rayWalls(P.x, P.y, p.x - P.x, p.y - P.y, Math.sqrt(dd)) < Math.sqrt(dd) - p.r - 2) continue; // 벽에 가려짐
    bd = dd; best = p;
  }
  return best;
}
function touchTarget(fireHeld) {
  // 보스가 보호막 때문에 무적이면 먼저 부숴야 하는 사물(히터, 서버 기둥)을 노린다
  const shielded = room.enemies.some(e => e.boss && !e.dead && e.invuln);
  if (shielded) {
    const p = nearestShootableProp(q => (q.type === 'heater' && !q.on) || q.type === 'spillar', 1200);
    if (p) return p;
  }
  const e = assistTarget(P.ang, Math.PI, 700);
  if (e) { e.isEnemy = true; return e; }
  if (fireHeld) return nearestShootableProp(q => !(q.type === 'heater' && q.on), 900);
  return null;
}

// ================= 경로 지도 생성 =================
function genMap(zone) {
  reseed(run.seed + zone * 7919 + 1);
  const rows = [];
  for (let r = 0; r < 6; r++) {
    const n = ri(2, 3), row = [];
    for (let i = 0; i < n; i++) row.push({ r, i, type: null, x: (i + 1) / (n + 1) + rr(-0.05, 0.05), next: [], obj: null, visited: false });
    rows.push(row);
  }
  const objs = ['exterminate', 'survive', 'defend', 'escort', 'collect', 'bounty'];
  for (const row of rows) for (const n of row) {
    if (n.r === 0) n.type = 'combat';
    else if (n.r === 5) n.type = rp(['rest', 'shop', 'rest', 'workshop']);
    else n.type = rweighted([
      ['combat', 44], ['elite', n.r >= 1 ? 14 : 0], ['shop', n.r >= 2 ? 11 : 0], ['workshop', 10], ['event', 13], ['rest', n.r >= 2 ? 8 : 0]
    ], x => x[1])[0];
  }
  // 상점/정비소 최소 1개 보장
  for (const need of ['shop', 'workshop']) {
    if (!rows.some(row => row.some(n => n.type === need))) { const row = rows[ri(2, 4)]; rp(row).type = need; }
  }
  for (const row of rows) for (const n of row) {
    if (n.type === 'combat') n.obj = zone === 0 && n.r === 0 ? 'exterminate' : rp(objs);
  }
  for (let r = 0; r < 5; r++) {
    const A = rows[r], B = rows[r + 1];
    for (const a of A) {
      let best = 0;
      for (let j = 1; j < B.length; j++) if (Math.abs(B[j].x - a.x) < Math.abs(B[best].x - a.x)) best = j;
      a.next = [best];
      const nb = best + (RNG() < 0.5 ? -1 : 1);
      if (B[nb] && RNG() < 0.55) a.next.push(nb);
    }
    B.forEach((b, j) => {
      if (!A.some(a => a.next.includes(j))) {
        let best = A[0];
        for (const a of A) if (Math.abs(a.x - b.x) < Math.abs(best.x - b.x)) best = a;
        best.next.push(j);
      }
    });
  }
  rows.push([{ r: 6, i: 0, type: 'boss', x: 0.5, next: [], visited: false }]);
  for (const n of rows[5]) n.next = [0];
  return rows;
}

function enterNode(r, i) {

    case 'elite': startRoom({ kind: 'elite', zone: run.zone, objective: 'exterminate', row: r }); break;

function update(dt, rdt) {
  G.time += rdt;
  run.time += dt;
  if (G.bossIntro) { G.bossIntro.t -= rdt; if (G.bossIntro.t <= 0) G.bossIntro = null; }
  if (G.objBanner) G.objBanner.t -= rdt;
  if (G.banner) { G.banner.t -= rdt; if (G.banner.t <= 0) G.banner = null; }
  updateTouchInput();
  updatePlayer(dt);
  updateAllies(dt);
  if (!G.bossIntro) { updateEnemies(dt); updateHacked(dt); }
  updateBullets(dt);
  updateVortices(dt);
  updateHazards(dt);
  updateProps(dt);
  updatePickups(dt);
  updateRoom(dt);
  if (room.leaving) { afterCombat(room.success, room.kind); return; }
  if (room.ending) { endRun(false); return; }
  updateParticles(dt);
  for (let i = G.texts.length - 1; i >= 0; i--) { const t = G.texts[i]; t.t -= rdt; t.y += t.vy * rdt; t.vy *= 0.94; if (t.t <= 0) G.texts.splice(i, 1); }
  for (let i = G.bolts.length - 1; i >= 0; i--) { G.bolts[i].t -= rdt; if (G.bolts[i].t <= 0) G.bolts.splice(i, 1); }
  for (let i = G.beams.length - 1; i >= 0; i--) { G.beams[i].t -= rdt; if (G.beams[i].t <= 0) G.beams.splice(i, 1); }
  for (let i = G.reactTexts.length - 1; i >= 0; i--) { G.reactTexts[i].t -= rdt; if (G.reactTexts[i].t <= 0) G.reactTexts.splice(i, 1); }
  G.flash = Math.max(0, G.flash - rdt * 1.5);
  G.shakeAmt = Math.max(0, G.shakeAmt - rdt * 40);
  updateCamera(rdt);
}

let lastT = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  pollGamepad();
  if (Input.gp && Input.gp.pause) { if (G.paused) resumeGame(); else pauseGame(); }
  try {
    if (G.screen === 'combat' && !G.paused && room) {
      let dt = rdt;
      if (G.hitstop > 0) { G.hitstop -= rdt; dt = 0; }
      else if (G.bossIntro) dt = rdt * 0.2;
      else if (G.slowmo > 0) { G.slowmo -= rdt; dt = rdt * 0.3; }
      update(dt, rdt);

      else renderMenuBG(rdt);

}

window.androidBack = function () {
  try {
    if (radioState) { advanceRadio(); return true; }
    if (G.screen === 'combat' || G.paused) { if (G.paused) resumeGame(); else pauseGame(); return true; }
    if (G.screen === 'overlay') return true;
    if (document.querySelector('#ui .logo')) return false; // 타이틀에서는 앱 종료
    if (run && run.map && G.screen === 'menu') saveRun();
    showTitle(); return true;
  } catch (e) { return false; }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) window.androidPause(); });
// 설치형 웹앱(PWA): http(s)로 열렸을 때만 서비스 워커 등록
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
showTitle();
requestAnimationFrame(frame);
</script>
