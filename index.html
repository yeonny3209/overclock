<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>오버클럭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07060d;--cy:#29f0ff;--mg:#ff3df0;--ye:#ffe14d;--or:#ff8a2a;--rd:#ff2d55;--tx:#e8ecff;--mu:#8a90b0;--pn:rgba(14,12,30,.94);--bd:#2e2a55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:70px 16px 24px;overflow-y:auto;background:rgba(5,4,12,.74);cursor:default}
.scr.top{justify-content:flex-start}
.scr.clear{background:rgba(5,4,12,.35)}
.logo{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:clamp(56px,11vw,136px);letter-spacing:4px;color:#fff;text-shadow:0 0 10px var(--cy),0 0 30px var(--cy),0 0 70px var(--mg);line-height:1;animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}97%{opacity:.6}}
.logo-en{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:14px;color:var(--mg);text-shadow:0 0 12px var(--mg);margin:10px 0 30px;font-size:clamp(14px,2.4vw,24px)}
h2{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 14px var(--cy);text-align:center}
h3{font-weight:900}
.sub{color:var(--mu);margin-bottom:18px;font-size:14px;text-align:center;line-height:1.6}
.btn{font-family:inherit;font-weight:700;font-size:16px;color:var(--tx);background:rgba(20,18,42,.92);border:1.5px solid var(--cy);padding:11px 22px;min-width:220px;margin:5px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:background .1s,color .1s;box-shadow:inset 0 0 14px rgba(41,240,255,.15)}
.btn:hover:not(:disabled){background:var(--cy);color:#05040c}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{min-width:0;padding:7px 14px;font-size:13px}
.btn.mg{border-color:var(--mg);box-shadow:inset 0 0 14px rgba(255,61,240,.15)}.btn.mg:hover:not(:disabled){background:var(--mg)}
.btn.ye{border-color:var(--ye)}.btn.ye:hover:not(:disabled){background:var(--ye)}
.btn.rd{border-color:var(--rd)}.btn.rd:hover:not(:disabled){background:var(--rd);color:#fff}
.btn.on{background:var(--cy);color:#05040c}
.col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.card{width:236px;background:var(--pn);border:1.5px solid var(--bd);padding:16px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;text-align:left}
.card:hover{transform:translateY(-4px);border-color:var(--cy);box-shadow:0 0 22px rgba(41,240,255,.35)}
.card.nohover{cursor:default}.card.nohover:hover{transform:none;box-shadow:none;border-color:var(--bd)}
.card.rare{border-color:#4db8ff}.card.legend{border-color:#ffb52e;box-shadow:0 0 14px rgba(255,181,46,.3)}
.card.curse{border-color:var(--rd);box-shadow:0 0 18px rgba(255,45,85,.45);background:rgba(40,6,16,.94)}
.card.locked{opacity:.45;cursor:not-allowed}.card.locked:hover{transform:none}
.card.sel{border-color:var(--ye);box-shadow:0 0 22px rgba(255,225,77,.5)}
.card h3{font-size:19px;margin-bottom:4px}
.card p{font-size:13px;color:#c5cae6;line-height:1.55}
.card .rib{position:absolute;top:8px;right:10px;font-size:11px;font-weight:900;letter-spacing:1px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:3px;margin:2px 3px 2px 0;color:#05040c;vertical-align:middle}
.muted{color:var(--mu)}.small{font-size:12px}.big{font-size:20px}
.coin{color:var(--ye);font-weight:700}
.panel{background:var(--pn);border:1px solid var(--bd);padding:14px 18px;margin:6px}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:linear-gradient(rgba(0,0,0,.8),transparent);font-size:14px;gap:12px;flex-wrap:wrap;z-index:2}
.topbar b{font-weight:900}
.hpbar{display:inline-block;width:120px;height:10px;background:#301020;border:1px solid #ff4d6d;vertical-align:middle;margin-left:6px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff7a8a)}
.map{position:relative;width:min(780px,94vw);height:max(420px,min(640px,68vh));margin-top:8px;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:2px solid #4a4670;background:#12102a;display:flex;align-items:center;justify-content:center;font-size:21px;transition:transform .12s;color:#fff;cursor:default}
.node.avail{cursor:pointer;animation:pulse .9s infinite alternate;border-color:var(--cy)}
.node.avail:hover{transform:scale(1.2)}
.node.done{opacity:.35}.node.cur{border-color:var(--ye);box-shadow:0 0 18px var(--ye)}
.node.boss{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:32px;border-color:var(--mg)}
.node .nl{position:absolute;top:100%;margin-top:3px;font-size:11px;white-space:nowrap;color:var(--mu);pointer-events:none}
@keyframes pulse{from{box-shadow:0 0 4px var(--cy)}to{box-shadow:0 0 22px var(--cy)}}
.radio{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(740px,92vw);background:rgba(8,6,22,.97);border:1px solid var(--cy);box-shadow:0 0 20px rgba(41,240,255,.25);padding:12px 18px 14px;font-size:15px;line-height:1.6;min-height:74px;pointer-events:auto;cursor:pointer;z-index:4}
.radio::before{content:'◉ 무전  —  클릭 / 스페이스로 넘기기';color:var(--mg);font-size:11px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.tabs .btn{min-width:0;padding:7px 14px;font-size:13px}
.list{width:min(960px,94vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.list .card{width:auto}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-size:15px}
.kv span:nth-child(odd){color:var(--mu)}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:24px;text-shadow:0 0 10px #000,0 0 4px #000;text-align:center;transition:opacity .3s}
input[type=range]{width:200px;accent-color:var(--cy)}
.hint{color:var(--mu);font-size:12px;margin-top:14px;text-align:center;line-height:1.7}
.slot{display:inline-block;width:14px;height:14px;border:1px solid #888;margin-left:3px;vertical-align:middle;border-radius:2px}
.slot.f{background:var(--cy);border-color:var(--cy)}
.charcard{width:210px;min-height:280px}
.chargrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(760px,94vw)}
.ctile{background:var(--pn);border:1.5px solid var(--bd);padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ctile .cdot{width:26px;height:26px;border-radius:50%;border:3px solid var(--cc);box-shadow:0 0 10px var(--cc);margin-bottom:2px}
.ctile b{color:var(--cc);font-size:14px}.ctile span{font-size:11px;color:var(--mu)}
.ctile.sel{border-color:var(--cc);box-shadow:0 0 14px var(--cc)}.ctile.locked{opacity:.45}
.cdetail{width:min(760px,94vw);line-height:1.6;font-size:14px;margin-top:8px}.cdetail p{margin-top:4px}
@media(max-width:520px){.chargrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.charcard .av{width:64px;height:64px;border-radius:50%;margin-bottom:10px;box-shadow:0 0 18px currentColor;border:3px solid currentColor}
.ocsel{display:flex;align-items:center;gap:10px;margin:14px 0}
.ocsel b{font-family:'Orbitron';font-size:22px;color:var(--mg);min-width:40px;text-align:center}
.evbox{width:min(640px,94vw);text-align:center}
.evbox .desc{font-size:16px;line-height:1.8;margin:10px 0 18px;color:#d6daf0}
table.tb{border-collapse:collapse;font-size:13px}
table.tb td{padding:3px 10px;border-bottom:1px solid #22203f}
.btn:focus-visible,.card:focus-visible,.node:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.logo,.node.avail{animation:none}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a3570}
@media(max-width:640px){.card{width:100%}.btn{min-width:160px}}
</style>

<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="toast"></div>
<script>
'use strict';
// ================= 기본 유틸 =================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const d2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString();

// ================= 시드 난수 (경로/보상용) =================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RNG = mulberry32(Date.now() & 0x7fffffff);
function reseed(s) { RNG = mulberry32(s | 0); }
const rr = (a, b) => a + RNG() * (b - a);
const ri = (a, b) => Math.floor(a + RNG() * (b - a + 1));
const rp = a => a[Math.floor(RNG() * a.length)];
function rshuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rweighted(items, wf) {
  let t = 0; for (const it of items) t += wf(it);
  let r = RNG() * t;
  for (const it of items) { r -= wf(it); if (r <= 0) return it; }
  return items[items.length - 1];
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ================= 저장 =================
const SAVE_KEY = 'overclock_save_v1';
function defaultSave() {
  return {
    chips: 0, totalChips: 0, unlocks: {},
    stats: { dodged: 0, runs: 0, clears: 0, zone2: false, sniperBoss: false, kills: 0, bestZone: 0, reactions: 0 },
    codex: { weapon: {}, enemy: {}, boss: {}, reaction: {}, event: {} },
    ocMax: 0, arenaBest: 0, daily: {},
    settings: { shake: !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), particles: 2, vol: 0.5, dmgNum: true, aimAssist: false, autoFire: false, autoCoin: true, skipRadio: false, minimap: true, touchAutoFire: true }
  };
}
let SAVE = defaultSave();
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) {
      const d = defaultSave();
      SAVE = Object.assign({}, d, s, {
        stats: Object.assign({}, d.stats, s.stats || {}),
        codex: Object.assign({}, d.codex, s.codex || {}),
        settings: Object.assign({}, d.settings, s.settings || {}),
        unlocks: Object.assign({}, s.unlocks || {}),
        daily: Object.assign({}, s.daily || {})
      });
      for (const k in d.codex) if (!SAVE.codex[k]) SAVE.codex[k] = {};
    }
  } catch (e) { SAVE = defaultSave(); }
}
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }
function codex(cat, id) {
  if (!SAVE.codex[cat][id]) { SAVE.codex[cat][id] = 1; saveGame(); return true; }
  return false;
}

// ================= 캔버스 =================
const canvas = $('cv');
const ctx = canvas.getContext('2d');
let VW = 1280, VH = 720, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
const FONT = "'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif";
const FONT2 = "'Noto Sans KR','Malgun Gothic',sans-serif";

// ================= 입력 =================
const Input = {
  keys: {}, pressed: {}, mx: VW / 2, my: VH / 2, mb: [0, 0, 0], mp: [0, 0, 0], wheel: 0,
  gp: null, gpPrev: [], usingPad: false
};
function initInput() {
  addEventListener('keydown', e => {
    if (!Input.keys[e.code]) Input.pressed[e.code] = 1;
    Input.keys[e.code] = 1;
    if (G.screen === 'combat' && ['Space', 'Tab', 'KeyQ', 'KeyE', 'KeyR'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && G.screen !== 'combat' && document.activeElement && document.activeElement.tagName === 'BUTTON') e.preventDefault();
    Input.usingPad = false;
    onGlobalKey(e);
  });
  addEventListener('keyup', e => { Input.keys[e.code] = 0; });
  addEventListener('mousemove', e => { Input.mx = e.clientX; Input.my = e.clientY; Input.usingPad = false; if (!(e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)) Input.touch = false; });
  addEventListener('mousedown', e => { Input.mb[e.button] = 1; Input.mp[e.button] = 1; SFX.init(); });
  addEventListener('mouseup', e => { Input.mb[e.button] = 0; });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('wheel', e => { Input.wheel += Math.sign(e.deltaY); }, { passive: true });
  addEventListener('blur', () => { Input.keys = {}; Input.mb = [0, 0, 0]; });
}
function endInputFrame() { Input.pressed = {}; Input.mp = [0, 0, 0]; Input.wheel = 0; }
// 게임패드: 왼쪽 스틱 이동, 오른쪽 스틱 조준, RT 사격, LT 스킬, A 구르기, X 재장전, Y 교체, B 상호작용, START 일시정지
function pollGamepad() {
  Input.gp = null;
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  const p = pads && (pads[0] || pads[1]);
  if (!p) return;
  const dz = v => Math.abs(v) < 0.18 ? 0 : v;
  const btn = i => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.4);
  const cur = [];
  for (let i = 0; i < p.buttons.length; i++) cur[i] = btn(i);
  const pr = i => cur[i] && !Input.gpPrev[i];
  const g = {
    lx: dz(p.axes[0] || 0), ly: dz(p.axes[1] || 0), rx: dz(p.axes[2] || 0), ry: dz(p.axes[3] || 0),
    fire: cur[7], skill: pr(6), roll: pr(0), reload: pr(2), swap: pr(3), interact: pr(1), pause: pr(9), od: pr(4)
  };
  Input.gpPrev = cur;
  if (g.lx || g.ly || g.rx || g.ry || cur.some(Boolean)) Input.usingPad = true;
  Input.gp = g;
}

// ================= 효과음 (Web Audio 합성) =================
const SFX = {
  ctx: null, master: null, noiseBuf: null, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = SAVE.settings.vol;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    } catch (e) { this.ctx = null; }
  },
  setVol(v) { if (this.master) this.master.gain.value = v; },
  tone(type, f0, f1, dur, vol, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1, ftype = 'lowpass', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = ftype;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  play(n, v = 1) {
    if (!this.ctx || SAVE.settings.vol <= 0) return;
    const now = this.ctx.currentTime;
    const gap = { water: 0.06, flame: 0.06, smg: 0.04, hit: 0.035, eshoot: 0.05, coin: 0.04, kill: 0.03 }[n] || 0.025;
    if (this.last[n] && now - this.last[n] < gap) return;
    this.last[n] = now;
    const p = rand(0.92, 1.08);
    try {
      switch (n) {
        case 'pistol': this.tone('square', 760 * p, 180, 0.09, 0.14 * v); this.noise(0.06, 0.12 * v, 4000, 800); break;
        case 'smg': this.tone('square', 900 * p, 260, 0.05, 0.08 * v); this.noise(0.04, 0.09 * v, 5000, 1200); break;
        case 'shotgun': this.noise(0.28, 0.45 * v, 3200, 200); this.tone('sawtooth', 160, 45, 0.18, 0.2 * v); break;
        case 'sniper': this.tone('sawtooth', 1500 * p, 70, 0.32, 0.22 * v); this.noise(0.35, 0.35 * v, 6000, 150); break;
        case 'grenade': this.tone('sine', 320 * p, 140, 0.14, 0.2 * v); this.noise(0.08, 0.12 * v, 1500, 300); break;
        case 'flame': this.noise(0.12, 0.1 * v, 900, 400, 'bandpass'); break;
        case 'water': this.noise(0.1, 0.09 * v, 2600, 1200, 'bandpass'); this.tone('sine', 700 * p, 400, 0.06, 0.03 * v); break;
        case 'tesla': this.tone('sawtooth', 1700 * p, 300, 0.16, 0.12 * v); this.tone('square', 2600, 900, 0.1, 0.06 * v); this.noise(0.12, 0.1 * v, 8000, 3000, 'highpass'); break;
        case 'cryo': this.tone('triangle', 1900 * p, 800, 0.12, 0.13 * v); break;
        case 'boomer': this.tone('triangle', 420 * p, 950, 0.16, 0.13 * v); break;
        case 'bhole': this.tone('sine', 140, 38, 0.7, 0.35 * v); this.tone('sawtooth', 70, 30, 0.6, 0.08 * v); break;
        case 'hit': this.tone('square', 320 * p, 140, 0.04, 0.06 * v); break;
        case 'crit': this.tone('square', 1300 * p, 500, 0.07, 0.1 * v); break;
        case 'block': this.tone('triangle', 2200 * p, 1400, 0.05, 0.08 * v); break;
        case 'kill': this.noise(0.12, 0.16 * v, 2500, 300); this.tone('square', 240 * p, 60, 0.12, 0.08 * v); break;
        case 'explode': this.noise(0.55, 0.55 * v, 2200, 80); this.tone('sine', 130 * p, 28, 0.45, 0.45 * v); break;

// ================= 진행 중인 판 자동 저장 (모드별 슬롯) =================
const RUN_KEY = 'overclock_run_v1';
function runKey(mode) { return RUN_KEY + '_' + (mode || 'campaign'); }
function saveRun() {
  try { if (run && run.mode !== 'arena' && run.map && !run.ended) localStorage.setItem(runKey(run.mode), JSON.stringify(run)); } catch (e) { }
}
function clearRun(mode) { try { localStorage.removeItem(runKey(mode)); if ((mode || 'campaign') === 'campaign') localStorage.removeItem(RUN_KEY); } catch (e) { } }
function clearAllRuns() { for (const m of ['campaign', 'daily']) clearRun(m); }
function peekRun(mode = 'campaign') {
  try {
    let r = JSON.parse(localStorage.getItem(runKey(mode)));
    if (!r) { const old = JSON.parse(localStorage.getItem(RUN_KEY)); if (old && (old.mode || 'campaign') === mode) r = old; }
    return r && r.map && r.weapons && CHARS[r.char] ? r : null;
  } catch (e) { return null; }
}

        spawnBullet(Object.assign({}, common, { x: mx, y: my, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, r: s.r, dmg: dmg * dm, life: s.life, pierce: s.pierce + pierceBonus, big: w.id === 'sniper' }));
      }
  }
  // 빛 7세트: 4번째 공격마다 관통 광선
  if (BS.beamEvery && run.shotCounter % BS.beamEvery === 0 && s.type !== 'beam') fireBeam(a, Math.max(14, dmg * 0.8), crit, 'light', { wid: 'beam7', w: 3 });
  // 연출
  part({ x: mx, y: my, vx: 0, vy: 0, life: 0.06, size: 10 + s.shake * 2, color: common.color, kind: 'flash' });
  if (['pistol', 'smg', 'shotgun', 'sniper'].includes(w.id)) {
    const pa = a + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
    part({ x: P.x, y: P.y, vx: Math.cos(pa) * rand(60, 120), vy: Math.sin(pa) * rand(60, 120), life: rand(1.5, 2.5), size: 3, color: '#e6c15a', kind: 'shell', rot: rand(0, TAU) });
  }
  shake(s.shake * 0.6);
  P.kx -= ca * s.shake * 10; P.ky -= sa * s.shake * 10;
  SFX.play(s.sfx);
}

// 관통 광선 (광선총, 빛 7세트, 빛 굴절)
function fireBeam(a, dmg, crit, tag, o = {}) {
  const sx = (o.x != null ? o.x : P.x + Math.cos(a) * 20), sy = (o.y != null ? o.y : P.y + Math.sin(a) * 20);
  const L = rayWalls(sx, sy, Math.cos(a), Math.sin(a), o.range || 900);
  const ex = sx + Math.cos(a) * L, ey = sy + Math.sin(a) * L;
  G.beams.push({ x1: sx, y1: sy, x2: ex, y2: ey, t: 0.14, max: 0.14, color: TAG_COLOR[tag] || '#fff', w: o.w || 5 });
  if (G.beams.length > 40) G.beams.shift();
  for (const e of room.enemies.slice()) {
    if (e.dead || e.spawning) continue;
    if (segDist(e.x, e.y, sx, sy, ex, ey) < e.r + 6) {
      damageEnemy(e, dmg, { tag, crit, wid: o.wid, ang: a, statusDmg: dmg });
      if (!o.noProc) onHitProcs(e, dmg, tag, { crit, ang: a, x: e.x, y: e.y, wid: o.wid, tag2: o.tag2 });
    }
  }
  for (const p of room.props) if (p.shootable && !p.dead && segDist(p.x, p.y, sx, sy, ex, ey) < p.r + 6) hitProp(p, dmg, null);
}

function teslaFire(s, dmg, crit, a, status) {
  const sx = P.x + Math.cos(a) * 22, sy = P.y + Math.sin(a) * 22;
  let best = null, bs = 1e9;
  const cands = room.enemies.filter(e => !e.dead && !e.spawning);
  for (const e of cands) {
    const d = dist(P.x, P.y, e.x, e.y); if (d > s.range) continue;
    const ad = Math.abs(angDiff(a, angTo(P.x, P.y, e.x, e.y))); if (ad > 0.65) continue;
    const score = d * (1 + ad * 2) * (e.invuln ? 5 : 1);
    if (score < bs) { bs = score; best = e; }
  }
  if (!best) { // 사물 (히터, 드럼통 등)
    for (const p of room.props) {
      if (!p.shootable || p.dead) continue;
      const d = dist(P.x, P.y, p.x, p.y); if (d > s.range) continue;
      if (Math.abs(angDiff(a, angTo(P.x, P.y, p.x, p.y))) > 0.5) continue;
      addBolt(sx, sy, p.x, p.y, s.color); hitProp(p, dmg, null); return;
    }
    const L = rayWalls(sx, sy, Math.cos(a), Math.sin(a), s.range * 0.6);
    const ex = sx + Math.cos(a) * L, ey = sy + Math.sin(a) * L;
    addBolt(sx, sy, ex, ey, s.color);
    if (s.tag === 'elec') { const h = hazardAt(ex, ey, 'water'); if (h) electrify(h, true); }
    return;
  }
  const hit = new Set([best]);
  let cur = best;
  addBolt(sx, sy, best.x, best.y, TAG_COLOR[s.tag] || s.color);
  const zap = t => {
    damageEnemy(t, dmg, { tag: s.tag, crit, wid: 'tesla', statusDmg: dmg, ang: angTo(P.x, P.y, t.x, t.y) });
    if (status) applyStatus(t, status, { dmg });
    onHitProcs(t, dmg, s.tag, { crit, ang: angTo(P.x, P.y, t.x, t.y), x: t.x, y: t.y, wid: 'tesla', tag2: s.tag2 });
    if (s.tag === 'elec') { const h = hazardAt(t.x, t.y, 'water'); if (h) electrify(h, true); }
  };
  zap(best);
  for (let k = 1; k < s.chain; k++) {
    let n = null, nd = 240 * 240;
    for (const e of cands) { if (e.dead || hit.has(e)) continue; const dd = d2(cur.x, cur.y, e.x, e.y); if (dd < nd) { nd = dd; n = e; } }
    if (!n) break;
    addBolt(cur.x, cur.y, n.x, n.y, TAG_COLOR[s.tag] || s.color);
    hit.add(n); zap(n); cur = n;
  }
}

function startReload(w) {
  const s = wStats(w);

    burst(P.x, P.y, '#fff04d', 12, 250, 0.3, 2);

}

// ================= 중력장 (블랙홀 / 어둠 각성 균열) =================
function spawnVortex(b) {
  const legend = b.legend && b.wid === 'blackhole';
  room.vortices.push({ x: b.x, y: b.y, t: legend ? 6 : 3, max: legend ? 6 : 3, r: 220, dmg: b.dmg, tick: 0, tag: b.tag, stacks: legend ? 2 : 1 });

}
function updateVortices(dt) {
  for (let i = room.vortices.length - 1; i >= 0; i--) {
    const v = room.vortices[i];
    v.t -= dt; v.tick -= dt;
    for (const e of room.enemies) {
      if (e.dead || e.boss || e.heavy || e.spawning) continue;
      const d = dist(v.x, v.y, e.x, e.y);
      if (d < v.r && d > 4) { const f = (260 * (1 - d / v.r) + 70) * dt; e.x += (v.x - e.x) / d * f; e.y += (v.y - e.y) / d * f; }
    }
    if (v.tick <= 0) {
      v.tick = 0.25;
      for (const e of room.enemies) if (!e.dead && !e.spawning && d2(v.x, v.y, e.x, e.y) < (v.r * 0.6) ** 2) damageEnemy(e, v.dmg * dynDmg(), { tag: ELEM_TAGS.includes(v.tag) ? v.tag : null, quiet: true, dot: true, stacks: v.stacks });
    }
    if (Math.random() < 0.6) { const a = rand(0, TAU); part({ x: v.x + Math.cos(a) * v.r, y: v.y + Math.sin(a) * v.r, vx: -Math.cos(a) * v.r * 2, vy: -Math.sin(a) * v.r * 2, life: 0.45, size: 2.5, color: '#9b6bff', kind: 'dot' }); }
    if (v.t <= 0) room.vortices.splice(i, 1);

}

// ================= 폭발 (폭발 태그 전용) =================
function explode(x, y, r, dmg, o = {}) {
  const team = o.team || 'p';
  if (team === 'p') { r *= BS.expRadius; dmg *= BS.expDmg; }
  if (team === 'p') for (const e of room.enemies) {
    if (!e.dead && e.shockT > 0 && d2(x, y, e.x, e.y) < (r + e.r) ** 2) { r *= 1.5; reaction('overload', x, y); break; }
  }
  for (const h of room.hazards) if (h.type === 'oil' && hazardOverlapCircle(h, x, y, r)) ignite(h, team === 'p');
  for (const e of room.enemies.slice()) {
    if (e.dead || e.spawning) continue;
    const dd = dist(x, y, e.x, e.y);
    if (dd < r + e.r) {
      const f = 1 - 0.4 * clamp(dd / r, 0, 1);
      const mult = team === 'e' ? (o.friendly != null ? o.friendly : 0.5) : 1;
      if (mult > 0) damageEnemy(e, dmg * f * mult, { tag: o.tag && ELEM_TAGS.includes(o.tag) ? o.tag : null, isExp: true, knock: 60, ang: angTo(x, y, e.x, e.y), wid: o.wid, quiet: o.small, dot: o.small });
    }
  }
  if (!P.dead && dist(x, y, P.x, P.y) < r + P.r) {
    if (team === 'e') damagePlayer(o.pdmg != null ? o.pdmg : dmg, o.owner);
    else if (!BS.safety && !o.noSelf) damagePlayer(Math.min(12, dmg * 0.3), null);
  }
  for (const p of room.props) if (p.shootable && !p.dead && dist(x, y, p.x, p.y) < r + p.r) hitProp(p, dmg * 0.8, null, true);
  if (team === 'e') for (const p of room.props) if (p.ally && !p.dead && dist(x, y, p.x, p.y) < r + p.r) hitAllyProp(p, dmg * 0.6);
  for (const w of room.walls) if (w.hp < Infinity && circleRect(x, y, r, w)) damageWall(w, dmg);
  if (team === 'p' && BS.exp7 && !o.small && !o.noChain) for (let i = 0; i < 3; i++) {
    const a = rand(0, TAU), d = rand(r * 0.5, r * 1.1);
    room.timers.push({ t: 0.12 + i * 0.12, fn: () => explode(x + Math.cos(a) * d, y + Math.sin(a) * d, 55, 14, { small: true, noChain: true, noSelf: true }) });
  }
  // 연출
  const big = r > 70 && !o.small;
  part({ x, y, vx: 0, vy: 0, life: 0.35, size: r, color: team === 'e' ? '#ff5a3a' : '#ffb347', kind: 'ring' });
  part({ x, y, vx: 0, vy: 0, life: 0.12, size: r * 0.8, color: '#fff2c0', kind: 'flash' });
  burst(x, y, '#ff8a2a', big ? 26 : 10, r * 3.2, 0.5, 4);
  burst(x, y, '#ffe14d', big ? 14 : 5, r * 2.4, 0.35, 3);
  smoke(x, y, big ? 8 : 3, r);
  if (big) addDecal(x, y, r * 0.8, 'scorch');
  shake(big ? r / 9 : r / 18);
  if (big) hitstop(0.035);
  SFX.play(big ? 'explode' : 'smallexp');
}

// ================= 피해 =================
function damageEnemy(e, dmg, o = {}) {
  if (e.dead || e.spawning) return 0;
  if (e.invuln) {
    if (!e.immT || G.time - e.immT > 0.4) { e.immT = G.time; floatText(e.x, e.y - e.r - 10, '면역', '#9aa0c0', 13); SFX.play('block'); }
    return 0;
  }
  e.alert = 0;
  let crit = !!o.crit;
  if (e.frozenT > 0) dmg *= 1 + BS.frozenBonus;
  if (e.shockT > 0) dmg *= 1 + BS.overcurrent;
  if (e.burnT > 0) dmg *= 1 + BS.incinerate;
  if (e.shred > 0) dmg *= 1 + e.shred * BS.shredPer;
  if (e.blindT > 0) {
    dmg *= 1 + BS.halo;
    if (BS.blindCrit && !crit && !o.dot) { dmg *= 2; crit = true; }
  }
  if ((e.boss || e.muts) && BS.bigSlayer) dmg *= 1 + BS.bigSlayer;
  if (BS.anvil && e.shred >= 5 && !o.dot && Math.random() < 0.1) { dmg *= 3; floatText(e.x, e.y - e.r - 24, '분쇄!', TAG_COLOR.metal, 18); }
  if (o.reaction) dmg *= BS.reactAmp * (e.soakT > 0 && BS.pressure ? 1.5 : 1);
  if (e.dmgTakenMult) dmg *= e.dmgTakenMult;
  if (o.isExp && e.frozenT > 0) {
    dmg *= 2; e.frozenT = 0; e.chill = 0;
    reaction('shatter', e.x, e.y);
    spawnShards(e.x, e.y, 6, 12, e);
  }
  if (e.barrier > 0) {
    const a = Math.min(e.barrier, dmg); e.barrier -= a; dmg -= a;
    if (e.barrier <= 0) { burst(e.x, e.y, '#4dd2ff', 16, 260, 0.4, 3); SFX.play('shield'); }
    if (dmg <= 0) { e.flash = 0.05; return 0; }
  }
  e.hp -= dmg; e.flash = 0.07; e.lastHit = G.time;
  if (!o.dot) addOd(Math.min(1.5, dmg / 90));
  if (SAVE.settings.dmgNum && !(o.quiet && Math.random() < 0.6)) {
    const big = crit || dmg >= 50;
    floatText(e.x + rand(-8, 8), e.y - e.r - 6, Math.max(1, Math.round(dmg)) + (crit ? '!' : ''), crit ? '#ffe14d' : big ? '#ffd0a0' : '#ffffff', crit ? 22 : big ? 18 : 13);
  }
  if (o.knock && !e.heavy && !e.boss) { const k = o.knock * (e.muts ? 0.5 : 1); e.kx += Math.cos(o.ang) * k; e.ky += Math.sin(o.ang) * k; }
  if (!o.dot) { if (crit) { hitstop(0.02); SFX.play('crit'); } else SFX.play('hit'); }
  if (dmg >= 60 && !o.dot) hitstop(0.04);
  // 시간: 메아리 표식 동안 받은 피해 누적
  if (e.echoT > 0 && !o.echo) e.echoAcc = (e.echoAcc || 0) + dmg;
  // 음파: 공명 전파
  if (e.resT > 0 && !o.res && !o.dot) resonate(e, dmg);
  // 이안류: 젖은 적끼리 피해 공유
  if (BS.riptide && e.soakT > 0 && !o.riptide && !o.dot) {
    for (const t of room.enemies) if (t !== e && !t.dead && !t.spawning && t.soakT > 0 && d2(t.x, t.y, e.x, e.y) < 300 * 300) damageEnemy(t, dmg * 0.2, { riptide: true, quiet: true, dot: true });
  }
  if (o.tag && ELEM_TAGS.includes(o.tag) && !o.noStatus && !e.dead) applyStatus(e, o.tag, { dmg: o.statusDmg || dmg, noChain: o.noChain, ang: o.ang, stacks: o.stacks, long: o.long });
  if (e.dead) return dmg;
  if (e.hp <= 0) {
    const def = EN[e.type];
    if (def.onZero && def.onZero(e, o)) return dmg;
    killEnemy(e, o);
    return dmg;
  }
  checkExecute(e, o);
  return dmg;
}

// ================= 상태 이상 (원소마다 고유 동작) =================
function applyStatus(e, tag, o = {}) {
  if (e.dead || e.spawning) return;
  const amp = (e.soakT > 0 && tag !== 'water') ? BS.soakAmp : 1;
  const st = (o.stacks || 1) + (amp > 1 ? Math.round(amp - 1) : 0);
  switch (tag) {
    case 'fire': // 화상: 지속 피해
      if (e.frozenT > 0 || e.chill > 0) { thermal(e); return; }
      if (e.poison > 0) venomburn(e);
      if (e.soakT > 0) scald(e);
      e.burnT = BS.burnDur * (amp > 1 ? 1.5 : 1);
      e.burnStacks = Math.min(BS.burnMax, (e.burnStacks || 0) + st);
      e.burnDps = 5 * BS.burnDmg * amp;
      if (e.gustT > 0) tornado(e);
      { const h = hazardAt(e.x, e.y, 'oil'); if (h) ignite(h, true); }
      break;
    case 'elec': // 감전: 연쇄
      e.shockT = 2 * amp;
      if (!o.noChain) {
        if (e.soakT > 0) conduct(e, o.dmg);
        if (e.shred >= 3) magnetize(e);
        chainLightning(e, o.dmg || 10, BS.chainN + (amp > 1 ? 1 : 0), BS.rechain);
      }
      { const h = hazardAt(e.x, e.y, 'water'); if (h) electrify(h, true); }
      break;
    case 'ice': // 빙결: 둔화 → 얼어붙음
      if (e.burnT > 0) { thermal(e); return; }
      e.chillT = 3 * BS.chillDur * (amp > 1 ? 1.5 : 1);
      if (e.frozenT <= 0) {
        e.chill = (e.chill || 0) + st;
        if (e.chill >= BS.freezeAt) {
          e.chill = 0;
          if (!e.boss) freezeNow(e);
          else { e.chill = BS.freezeAt - 1; e.chillT = 3; }
        }
      }
      break;
    case 'metal': // 파쇄: 받는 피해 증가 중첩
      if (e.soakT > 0) rust(e);
      e.shred = Math.min(BS.shredMax, (e.shred || 0) + st);
      e.shredT = BS.shredDur;
      break;
    case 'light': // 실명: 공격 불가
      if (e.corrode > 0) { eclipse(e); return; }
      if (e.boss) e.dazzleT = 2.5 * amp;
      else e.blindT = Math.max(e.blindT || 0, BS.blindDur * amp);
      break;
    case 'dark': // 침식: 처형 기준 누적
      if (e.blindT > 0 || e.dazzleT > 0) { eclipse(e); return; }
      e.corrode = Math.min(BS.corrodeMax, (e.corrode || 0) + st);
      e.corrodeT = 6;
      checkExecute(e, o);
      break;
    case 'wind': { // 돌풍: 밀어내기 + 충돌
      if (e.burnT > 0) tornado(e);
      if (!e.heavy && !e.boss) {
        const a = o.ang != null ? o.ang : angTo(P.x, P.y, e.x, e.y);
        const k = BS.gust * amp * (e.muts ? 0.6 : 1);
        e.kx += Math.cos(a) * k; e.ky += Math.sin(a) * k;
        e.gustT = 0.45; e.gustDmg = Math.max(10, o.dmg || 10); e.crashed = false;
      }
      break;
    }
    case 'water': // 젖음: 다른 상태 이상 증폭
      e.soakT = BS.soakDur * (o.long ? 2 : 1);
      break;
    case 'poison': // 중독: 최대 체력 비례 피해 + 쇠약
      if (e.burnT > 0) { venomburn(e); }
      e.poison = Math.min(BS.poisonMax, (e.poison || 0) + st);
      e.poisonT = BS.poisonDur * (amp > 1 ? 1.5 : 1);
      break;
    case 'time': // 메아리: 표식 동안의 피해를 잠시 뒤 다시
      if (!(e.echoT > 0)) { e.echoT = BS.echoDelay; e.echoAcc = 0; e.echoN = BS.echoTwice ? 2 : 1; e.echoMul = amp; }
      break;
    case 'sonic': // 공명: 같은 종류에게 피해 전파
      if (e.frozenT > 0) { sonicShatter(e); return; }
      e.resT = BS.resDur * (amp > 1 ? 1.5 : 1);
      if (BS.stagger && !e.boss) e.cd = (e.cd || 0) + 0.5;
      break;
  }
}
function freezeNow(e) {
  e.chill = 0;
  e.frozenT = 1.5 * BS.chillDur + BS.permafrost;
  SFX.play('freeze'); burst(e.x, e.y, '#bff4ff', 10, 160, 0.4, 3);
}
function chainLightning(e, dmg, n, rechain) {
  const tgts = room.enemies.filter(t => t !== e && !t.dead && !t.spawning && d2(t.x, t.y, e.x, e.y) < 170 * 170).sort((a, b) => d2(a.x, a.y, e.x, e.y) - d2(b.x, b.y, e.x, e.y)).slice(0, n);
  for (const t of tgts) {
    addBolt(e.x, e.y, t.x, t.y, '#fff04d', 0.15);
    damageEnemy(t, Math.max(3, dmg * BS.transfer), { tag: 'elec', noChain: true, quiet: true });
    if (rechain && !t.dead) {
      const t2 = room.enemies.find(q => q !== t && q !== e && !q.dead && !q.spawning && !tgts.includes(q) && d2(q.x, q.y, t.x, t.y) < 170 * 170);
      if (t2) { addBolt(t.x, t.y, t2.x, t2.y, '#fff04d', 0.15); damageEnemy(t2, Math.max(3, dmg * BS.transfer), { tag: 'elec', noChain: true, quiet: true }); }
    }
  }
}
function checkExecute(e, o = {}) {
  if (e.dead || e.boss || !(e.corrode > 0) || e.hp <= 0) return false;
  const thr = Math.min(BS.execCap, BS.execPer * e.corrode + BS.execFlat);
  if (e.hp > e.maxHp * thr) return false;
  // 처형
  floatText(e.x, e.y - e.r - 20, '처형', TAG_COLOR.dark, 18);
  part({ x: e.x, y: e.y, life: 0.25, size: e.r * 2.2, color: '#9b6bff', kind: 'ring' });
  addBolt(e.x - 20, e.y - 20, e.x + 20, e.y + 20, '#9b6bff', 0.12); addBolt(e.x + 20, e.y - 20, e.x - 20, e.y + 20, '#9b6bff', 0.12);
  SFX.play('slash');
  killEnemy(e, Object.assign({}, o, { exec: true }));
  return true;
}
// 충돌 피해 (바람)
function slamEnemy(e, mult = 1) {
  if (e.dead) return;
  const dmg = (e.gustDmg * 0.5 + 12) * BS.slamMult * mult * dynDmg();
  e.gustT = 0;

    chillT: 0, trailT: 0, stepT: 0, prompt: null, swapT: 0, pullT: 0, momT: 0, reaperShots: 0, bladeA: 0, odT: 0, hackCd: 0, stormT: 0, stormTick: 0, novaT: 0, fortT: 0
  };
  for (const w of run.weapons) w.first = true;
}

function updatePlayer(dt) {
  if (P.dead) return;
  P.iframe -= dt; P.hurtT -= dt; P.overT -= dt; P.slowT -= dt; P.chillT -= dt; P.skillCd -= dt; P.swapT -= dt; P.momT -= dt; P.odT -= dt; P.hackCd -= dt; P.novaT -= dt; P.fortT -= dt;
  const rm = rollMax();
  if (P.rollCharges < rm) { P.rollRe -= dt; if (P.rollRe <= 0) { P.rollCharges++; P.rollRe = 0.75 * BS.rollCdMult; } }
  const gp = Input.gp;
  // 이동 입력
  let mx = 0, my = 0;
  if (Input.keys.KeyW || Input.keys.ArrowUp) my -= 1;
  if (Input.keys.KeyS || Input.keys.ArrowDown) my += 1;
  if (Input.keys.KeyA || Input.keys.ArrowLeft) mx -= 1;
  if (Input.keys.KeyD || Input.keys.ArrowRight) mx += 1;
  if (gp) { mx += gp.lx; my += gp.ly; }
  if (Input.touch) { mx += Input.tmx; my += Input.tmy; }
  if (G.glitchT > 0) mx = -mx; // 마더보드 글리치: 좌우 반전
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  // 조준
  if (Input.usingPad && gp) {
    if (gp.rx || gp.ry) P.ang = Math.atan2(gp.ry, gp.rx);
    else if (ml > 0.2) P.ang = Math.atan2(my, mx);
  } else if (!Input.touch) { const mw = mouseWorld(); P.ang = angTo(P.x, P.y, mw.x, mw.y); }
  if (SAVE.settings.aimAssist && !Input.touch) { const t = assistTarget(P.ang, 0.3); if (t) P.ang = angTo(P.x, P.y, t.x, t.y); }

  const hz = playerHazards();
  // 구르기
  if ((Input.pressed.Space || (gp && gp.roll)) && P.rollT <= 0 && P.rollCharges > 0) doRoll(mx, my);
  if (P.rollT > 0) {
    P.rollT -= dt;
    P.vx = P.rollDx * 560; P.vy = P.rollDy * 560;
    P.trailT -= dt;
    if (P.trailT <= 0) {
      P.trailT = 0.045;
      part({ x: P.x, y: P.y, vx: 0, vy: 0, life: 0.25, size: P.r, color: CHARS[run.char].color, kind: 'ghost' });
      if (BS.firetrail) addHazard({ type: 'fire', x: P.x, y: P.y, r: 26, life: 2.5, player: true });
      if (BS.ice5) addHazard({ type: 'frostfloor', x: P.x, y: P.y, r: 30, life: 4 });
      if (BS.spray && room.hazards.length < 140) addHazard({ type: 'water', x: P.x, y: P.y, r: 30, life: 5, player: true });
    }
    if (BS.umbra) for (const e of room.enemies) if (!e.dead && !e.spawning && (e.umbraT || 0) < G.time && d2(e.x, e.y, P.x, P.y) < (e.r + 40) ** 2) { e.umbraT = G.time + 0.5; applyStatus(e, 'dark', { stacks: 2 }); }
    if (P.rollT <= 0) {
      if (BS.evasion > 1) P.iframe = Math.max(P.iframe, 0.15);
      if (BS.blastroll) explode(P.x, P.y, 90, 28, { noSelf: true });
      if (BS.updraft) { for (const e of room.enemies) if (!e.dead && !e.spawning && d2(e.x, e.y, P.x, P.y) < 150 * 150) applyStatus(e, 'wind', { ang: angTo(P.x, P.y, e.x, e.y), dmg: 15 }); part({ x: P.x, y: P.y, life: 0.3, size: 150, color: TAG_COLOR.wind, kind: 'ring' }); }
      if (BS.static) P.staticShots = 3;
      if (BS.bassdrop) { for (const e of liveNear(170)) { applyStatus(e, 'sonic', {}); damageEnemy(e, 20 * BS.dmgMult, { noStatus: true }); } part({ x: P.x, y: P.y, life: 0.3, size: 170, color: TAG_COLOR.sonic, kind: 'ring' }); }
      if (run.char === 'kai') P.momT = 1.5;
    }
  } else {
    const spd = 235 * BS.moveMult * (P.chillT > 0 ? 0.7 : 1) * hz.slow * (P.odT > 0 ? 1.25 : 1);
    const acc = hz.slick ? 2.5 : 14;
    P.vx = lerp(P.vx, mx * spd, Math.min(1, acc * dt));
    P.vy = lerp(P.vy, my * spd, Math.min(1, acc * dt));
    if (ml > 0.1) { P.stepT -= dt; if (P.stepT <= 0) { P.stepT = 0.12; part({ x: P.x - mx * 8, y: P.y - my * 8 + 6, vx: rand(-10, 10), vy: rand(-10, 10), life: 0.3, size: 3, color: 'rgba(255,255,255,0.25)', kind: 'smoke' }); } }
  }
  P.x += (P.vx + hz.px + P.kx) * dt;
  P.y += (P.vy + hz.py + P.ky) * dt;
  P.kx -= P.kx * Math.min(1, 10 * dt); P.ky -= P.ky * Math.min(1, 10 * dt);
  pushOutWalls(P);
  P.x = clamp(P.x, P.r, room.w - P.r); P.y = clamp(P.y, P.r, room.h - P.r);

  // 무기
  const w = curW(), s = wStats(w);
  if (w.reloadT > 0) { w.reloadT -= dt; if (w.reloadT <= 0) { w.reloadT = 0; w.ammo = s.mag; w.first = true; SFX.play('reloaded'); } }
  const freeAmmo = BS.infAmmo || P.odT > 0;
  if ((P.overT > 0 || freeAmmo) && w.reloadT > 0) { w.reloadT = 0; w.ammo = s.mag; }
  if (w.cd > 0) w.cd -= dt;
  const autoShot = (SAVE.settings.autoFire || Input.touchAuto) && !!assistTarget(P.ang, 0.35);
  const firing = !G.bossIntro && (Input.mb[0] || (gp && gp.fire) || Input.touchFire || autoShot) && P.swapT <= 0;
  if (!firing && w.spin > 0) w.spin = Math.max(0, w.spin - dt * 0.8);
  if (firing && w.cd <= 0 && w.reloadT <= 0) {
    if (s.mag !== Infinity && w.ammo <= 0 && P.overT <= 0 && !freeAmmo) { startReload(w); }
    else {
      shoot(w);
      w.cd = (w.cd < -0.05 ? 0 : w.cd) + 1 / (s.rate * (P.overT > 0 ? 2 : 1) * (P.odT > 0 ? 1.6 : 1));
      if (P.overT <= 0 && !freeAmmo && s.mag !== Infinity) { w.ammo--; if (w.ammo <= 0) startReload(w); }
    }
  }
  if (Input.pressed.KeyR || (gp && gp.reload)) startReload(w);
  if ((Input.pressed.KeyQ || Input.wheel !== 0 || (gp && gp.swap)) && run.weapons.length > 1) {
    curW().reloadT = 0; run.cur = 1 - run.cur; P.swapT = 0.15; SFX.play('ui');
    const nw = curW(); if (wStats(nw).mag !== Infinity && nw.ammo <= 0) startReload(nw);
  }
  // 스킬
  if ((Input.mp[2] || (gp && gp.skill)) && !G.bossIntro) useSkill();
  if ((Input.pressed.KeyF || (gp && gp.od)) && !G.bossIntro) activateOverdrive();
  // 전기 5세트: 2.5초마다 낙뢰
  if (BS.elec5) {
    run.boltT = (run.boltT || 0) - dt;
    if (run.boltT <= 0) {
      run.boltT = 2.5;
      const ts = room.enemies.filter(e => !e.dead && !e.spawning && !e.invuln).sort((a, b) => d2(a.x, a.y, P.x, P.y) - d2(b.x, b.y, P.x, P.y)).slice(0, 3);
      for (const t of ts) { strike(t.x, t.y); damageEnemy(t, 30 * dynDmg(), { tag: 'elec' }); }
    }
  }
  if (BS.awakened.length) updateAwaken(dt);
  // 볼트: 천둥 폭풍
  if (P.stormT > 0) {
    P.stormT -= dt; P.stormTick -= dt;
    if (P.stormTick <= 0) {
      P.stormTick = 0.25;
      const ts = liveNear(450).filter(e => !e.invuln);
      if (ts.length) { const t = pick(ts); strike(t.x, t.y); damageEnemy(t, 25 * BS.dmgMult * dynDmg(), { tag: 'elec' }); }
    }
  }
  if (BS.surv7) { run.regenAcc = (run.regenAcc || 0) + dt; if (run.regenAcc >= 2) { run.regenAcc = 0; if (run.hp < run.maxHp) healRun(3, true); } }
  // 상호작용
  P.prompt = null;
  const it = findInteract();
  if (it) {
    P.prompt = it.label;
    if (Input.pressed.KeyE || (gp && gp.interact)) it.act();
  }
  // 콤보 타이머
  if (run.comboT > 0) { run.comboT -= dt; if (run.comboT <= 0) { if (run.combo >= 10) floatText(P.x, P.y - 40, '콤보 종료', '#9aa0c0', 14); run.combo = 0; } }
}

function doRoll(mx, my) {
  let dx = mx, dy = my;
  if (Math.hypot(dx, dy) < 0.1) { dx = Math.cos(P.ang); dy = Math.sin(P.ang); }
  const l = Math.hypot(dx, dy); dx /= l; dy /= l;
  P.rollDx = dx; P.rollDy = dy; P.rollT = 0.28 * (BS.evasion > 1 ? 1.15 : 1);
  if (P.rollCharges === rollMax()) P.rollRe = 0.75 * BS.rollCdMult;
  P.rollCharges--;
  if (BS.afterimage) room.allies.push({ type: 'decoy', x: P.x, y: P.y, t: 1, max: 1, r: 13 });
  SFX.play('roll');
}

function placeTurret(x, y) {
  if (wallAt(x, y)) { x = P.x; y = P.y; }
  const turrets = room.allies.filter(a => a.type === 'turret' && a.t > 0);
  if (turrets.length >= 3) turrets[0].t = 0;
  room.allies.push({ type: 'turret', x, y, t: 25, max: 25, cd: 0.3, ang: P.ang, r: 14 });
  burst(x, y, '#ffd23d', 14, 200, 0.4, 3);
}
function useSkill() {
  if (P.skillCd > 0) { SFX.play('empty'); return; }
  const c = CHARS[run.char];
  P.skillCd = P.skillMax = c.cd * BS.cdMult;
  SFX.play('skill');
  switch (run.char) {
    case 'rain': {
      P.overT = 5; const w = curW(); if (w.reloadT > 0) { w.reloadT = 0; w.ammo = wStats(w).mag; }
      floatText(P.x, P.y - 36, '과충전!', '#ff5a5a', 20);
      part({ x: P.x, y: P.y, vx: 0, vy: 0, life: 0.4, size: 60, color: '#ff5a5a', kind: 'ring' });
      break;
    }
    case 'momo': placeTurret(P.x + Math.cos(P.ang) * 44, P.y + Math.sin(P.ang) * 44); break;
    case 'kai': kaiSlash(); break;
    case 'sera':
      P.slowT = 5; G.flash = 0.2; G.flashColor = '180,140,255';
      part({ x: P.x, y: P.y, vx: 0, vy: 0, life: 0.6, size: 520, color: '#b48cff', kind: 'ring' });
      break;
    case 'blaze':
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; addHazard({ type: 'fire', x: clamp(P.x + Math.cos(a) * 110, 20, room.w - 20), y: clamp(P.y + Math.sin(a) * 110, 20, room.h - 20), r: 45, life: 4, player: true }); }
      for (const e of liveNear(230)) applyStatus(e, 'fire', { stacks: 2 });
      part({ x: P.x, y: P.y, life: 0.5, size: 230, color: '#ff7a2a', kind: 'ring' }); SFX.play('ignite'); shake(6);
      break;
    case 'volt': P.stormT = 4; P.stormTick = 0; floatText(P.x, P.y - 36, '천둥 폭풍!', '#ffe14d', 20); break;
    case 'nova':
      P.novaT = 3; P.iframe = Math.max(P.iframe, 3); healRun(15, true);
      for (const e of liveNear(350)) { applyStatus(e, 'light', {}); applyStatus(e, 'light', {}); }
      part({ x: P.x, y: P.y, life: 0.6, size: 350, color: '#fff4b0', kind: 'ring' }); G.flash = 0.25; G.flashColor = '255,250,210';
      break;
    case 'grim': {
      const L = Math.max(0, Math.min(260, rayWalls(P.x, P.y, Math.cos(P.ang), Math.sin(P.ang), 280) - 20));
      const tx = P.x + Math.cos(P.ang) * L, ty = P.y + Math.sin(P.ang) * L;
      for (let k = 0; k <= 6; k++) part({ x: lerp(P.x, tx, k / 6), y: lerp(P.y, ty, k / 6), life: 0.4, size: P.r, color: '#9b6bff', kind: 'ghost' });
      for (const e of room.enemies.slice()) if (!e.dead && !e.spawning && segDist(e.x, e.y, P.x, P.y, tx, ty) < e.r + 22) damageEnemy(e, 50 * BS.dmgMult * dynDmg(), { tag: 'dark', stacks: 3, ang: P.ang });
      P.x = tx; P.y = ty; P.iframe = Math.max(P.iframe, 0.35); SFX.play('tele');
      break;
    }
    case 'marin': {
      for (const e of room.enemies.slice()) {
        if (e.dead || e.spawning) continue;
        const d = dist(P.x, P.y, e.x, e.y), a = angTo(P.x, P.y, e.x, e.y);
        if (d < 330 && Math.abs(angDiff(P.ang, a)) < 0.65) damageEnemy(e, 45 * BS.dmgMult * dynDmg(), { tag: 'water', knock: 220, ang: a });
      }
      for (let k = 1; k <= 3; k++) { const x = P.x + Math.cos(P.ang) * 100 * k, y = P.y + Math.sin(P.ang) * 100 * k; if (!wallAt(x, y)) addHazard({ type: 'water', x, y, r: 48, life: 7, player: true }); }
      part({ x: P.x, y: P.y, life: 0.4, size: 330, color: '#3d8bff', kind: 'arc', rot: P.ang }); SFX.play('water'); shake(5);

  }
  if (BS.discharge) {
    const ts = room.enemies.filter(e => !e.dead && !e.spawning).sort((a, b) => d2(a.x, a.y, P.x, P.y) - d2(b.x, b.y, P.x, P.y)).slice(0, 5);
    for (const e of ts) { addBolt(P.x, P.y, e.x, e.y, '#fff04d'); damageEnemy(e, 25 * dynDmg(), { tag: 'elec' }); }
  }
  if (BS.dawn) {
    for (const e of room.enemies) if (!e.dead && !e.spawning && d2(e.x, e.y, P.x, P.y) < 420 * 420) applyStatus(e, 'light', {});
    part({ x: P.x, y: P.y, life: 0.4, size: 420, color: TAG_COLOR.light, kind: 'ring' });

}

function kaiSlash() {

  const tag = wStats(curW()).tag;

    if (d < R + e.r && Math.abs(angDiff(a, angTo(P.x, P.y, e.x, e.y))) < ARC) {
      const ang = angTo(P.x, P.y, e.x, e.y);
      damageEnemy(e, dmg, { knock: 260, ang, tag: ELEM_TAGS.includes(tag) ? tag : null });
      if (!e.dead) onHitProcs(e, dmg, tag, { ang, x: e.x, y: e.y });
    }
  }
  let n = 0;
  for (const b of BULLETS) {
    if (b.team !== 'e' || b.type === 'lob') continue;
    if (d2(b.x, b.y, P.x, P.y) < 220 * 220 && Math.abs(angDiff(a, angTo(P.x, P.y, b.x, b.y))) < 1.4) {
      const sp = Math.max(700, Math.hypot(b.vx, b.vy) * 1.8), ta = a + rand(-0.15, 0.15);
      b.team = 'p'; b.vx = Math.cos(ta) * sp; b.vy = Math.sin(ta) * sp; b.dmg = Math.max(25, b.dmg * 3) * BS.dmgMult;
      b.color = '#3dffb0'; b.hit.clear(); b.pierce = 2; b.life = b.maxLife = 1.2; b.owner = null; b.tag = ELEM_TAGS.includes(tag) ? tag : 'bullet'; b.status = null; b.chill = false; b.type = 'n'; n++;
    }
  }
  for (const p of room.props) if (p.shootable && !p.dead && dist(P.x, P.y, p.x, p.y) < R + p.r && Math.abs(angDiff(a, angTo(P.x, P.y, p.x, p.y))) < ARC) hitProp(p, dmg, null);
  if (n) floatText(P.x, P.y - 40, `반사 ×${n}`, '#3dffb0', 16);
  part({ x: P.x, y: P.y, vx: 0, vy: 0, life: 0.22, size: R, color: '#3dffb0', kind: 'arc', rot: a });
  SFX.play('slash'); shake(4);
}

// ================= 프리즘 각성 (태그별 9세트) =================
function metalBlades() {
  const out = [];
  for (let i = 0; i < 4; i++) { const a = P.bladeA + i * TAU / 4; out.push({ x: P.x + Math.cos(a) * 85, y: P.y + Math.sin(a) * 85, a }); }
  return out;
}
function awTimer(key, dt, every) {
  run.awT = run.awT || {};
  run.awT[key] = (run.awT[key] === undefined ? every * 0.5 : run.awT[key]) - dt;
  if (run.awT[key] <= 0) { run.awT[key] = every; return true; }
  return false;
}
function liveNear(r) { return room.enemies.filter(e => !e.dead && !e.spawning && d2(e.x, e.y, P.x, P.y) < r * r); }
function updateAwaken(dt) {
  const aw = BS.aw;

    for (let i = 0; i < 6; i++) { const a = rand(0, TAU); part({ x: P.x + Math.cos(a) * 170, y: P.y + Math.sin(a) * 170, vx: 0, vy: -50, life: 0.5, size: 4, color: '#ff7a2a', kind: 'dot' }); }
  }
  if (aw.elec && awTimer('elec', dt, 1)) {
    const vis = room.enemies.filter(e => !e.dead && !e.spawning && !e.invuln && onScreen(e.x, e.y, 0));
    if (vis.length) { const t = pick(vis); strike(t.x, t.y); damageEnemy(t, 40 * BS.dmgMult * dynDmg(), { tag: 'elec' }); }
  }
  if (aw.ice && awTimer('ice', dt, 0.6)) {
    for (const e of liveNear(200)) applyStatus(e, 'ice', {});

  }
  if (aw.metal) {
    P.bladeA += dt * 4;
    for (const bl of metalBlades()) {

        if (e.dead || e.spawning || e.invuln) continue;
        if (d2(bl.x, bl.y, e.x, e.y) < (e.r + 14) ** 2 && (e.bladeCd || 0) <= G.time) {
          e.bladeCd = G.time + 0.35;
          damageEnemy(e, 20 * BS.dmgMult * dynDmg(), { tag: 'metal', stacks: 2, quiet: true });
          burst(e.x, e.y, TAG_COLOR.metal, 5, 160, 0.25, 2);

    }
  }
  if (aw.light && awTimer('light', dt, 6)) {
    G.flash = 0.35; G.flashColor = '255,250,220'; SFX.play('reaction');
    floatText(P.x, P.y - 50, '성광!', TAG_COLOR.light, 24);
    for (const e of room.enemies) if (!e.dead && !e.spawning && onScreen(e.x, e.y, 60)) { applyStatus(e, 'light', {}); applyStatus(e, 'light', {}); damageEnemy(e, 40 * BS.dmgMult * dynDmg(), { noStatus: true, quiet: true }); }
    for (const b of BULLETS) if (b.team === 'e' && onScreen(b.x, b.y, 60)) b.dead = true;
  }
  if (aw.wind) {
    for (const b of BULLETS) {
      if (b.team !== 'e' || b.type === 'lob' || b.dead) continue;
      if (d2(b.x, b.y, P.x, P.y) < 95 * 95) {
        const a = angTo(P.x, P.y, b.x, b.y), sp = Math.max(600, Math.hypot(b.vx, b.vy) * 1.5);
        b.team = 'p'; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.dmg = Math.max(15, b.dmg * 2) * BS.dmgMult;
        b.color = TAG_COLOR.wind; b.hit.clear(); b.pierce = 1; b.life = b.maxLife = 1; b.owner = null; b.tag = 'wind'; b.type = 'n'; b.chill = false;
      }
    }
    if (awTimer('wind', dt, 3)) {
      for (const e of liveNear(240)) applyStatus(e, 'wind', { ang: angTo(P.x, P.y, e.x, e.y), dmg: 25 });
      part({ x: P.x, y: P.y, life: 0.35, size: 240, color: TAG_COLOR.wind, kind: 'ring' }); SFX.play('roll');
    }
  }
  if (aw.poison && awTimer('poison', dt, 0.5)) {
    for (const e of liveNear(220)) applyStatus(e, 'poison', {});
    for (let i = 0; i < 4; i++) { const a = rand(0, TAU), d = rand(60, 220); part({ x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, vx: 0, vy: -20, life: 0.8, size: rand(8, 14), color: 'rgba(182,255,61,0.18)', kind: 'smoke' }); }
  }
  if (aw.time && awTimer('time', dt, 6)) {
    floatText(P.x, P.y - 50, '시간 정지!', TAG_COLOR.time, 22); G.flash = 0.3; G.flashColor = '216,200,255'; SFX.play('glitch');
    for (const e of room.enemies) if (!e.dead && !e.spawning && onScreen(e.x, e.y, 60)) e.stasisT = 1.5;
  }

// ================= 아군 (포탑, 로봇, 분신) =================
function updateAllies(dt) {
  for (let i = room.allies.length - 1; i >= 0; i--) {
    const a = room.allies[i];
    a.t -= dt;
    if (a.type === 'turret' || a.type === 'robot') {
      if (a.type === 'robot') {
        const tx = P.x - Math.cos(P.ang) * 50 + 30, ty = P.y - Math.sin(P.ang) * 50;
        a.x = lerp(a.x, tx, Math.min(1, 3 * dt)); a.y = lerp(a.y, ty, Math.min(1, 3 * dt));
      }
      a.cd -= dt;
      const range = a.type === 'turret' ? 560 : 480;
      let best = null, bd = range * range;
      for (const e of room.enemies) {
        if (e.dead || e.spawning || e.invuln) continue;
        const dd = d2(a.x, a.y, e.x, e.y);
        if (dd < bd && rayWalls(a.x, a.y, e.x - a.x, e.y - a.y, Math.sqrt(dd)) >= Math.sqrt(dd) - 2) { bd = dd; best = e; }
      }
      if (best) {
        const ta = angTo(a.x, a.y, best.x, best.y);
        a.ang += clamp(angDiff(a.ang, ta), -10 * dt, 10 * dt);
        if (a.cd <= 0 && Math.abs(angDiff(a.ang, ta)) < 0.3) {
          a.cd = a.type === 'robot' ? 0.4 : 0.2;
          const tag = wStats(curW()).tag;
          spawnBullet({ x: a.x + Math.cos(a.ang) * 16, y: a.y + Math.sin(a.ang) * 16, vx: Math.cos(a.ang) * 860, vy: Math.sin(a.ang) * 860, r: 3.5, dmg: 11 * BS.dmgMult * dynDmg(), team: 'p', life: 0.75, tag: tag === 'exp' ? 'bullet' : tag, pierce: 0, color: a.type === 'robot' ? '#6dd5ff' : (TAG_COLOR[tag] || '#ffd23d'), wid: 'turret', small: true });
          SFX.play('smg', 0.4);
        }
      }
    }
    if (a.t <= 0) { burst(a.x, a.y, '#aaa', 10, 150, 0.4, 2); room.allies.splice(i, 1); }
  }
}

// ================= 획득물 =================
function updatePickups(dt) {
  const rad = 44 * BS.magnet * (SAVE.settings.autoCoin ? 1.6 : 1);
  const magnets = room.enemies.filter(e => !e.dead && e.muts && e.muts.includes('magnet'));
  for (let i = room.pickups.length - 1; i >= 0; i--) {
    const p = room.pickups[i];
    if (p.type === 'coin') {
      p.t -= dt;
      if (p.t <= 0) { room.pickups.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt);
      let grabbed = false;
      for (const m of magnets) {
        const d = dist(p.x, p.y, m.x, m.y);
        if (d < 280) {
          p.x += (m.x - p.x) / Math.max(1, d) * 260 * dt; p.y += (m.y - p.y) / Math.max(1, d) * 260 * dt;
          if (d < m.r) { m.heldCoins += p.val; room.pickups.splice(i, 1); grabbed = true; }
          break;
        }
      }
      if (grabbed) continue;
      const d = dist(p.x, p.y, P.x, P.y);
      if (d < rad * 2.2 && !P.dead && d > 0.5) {
        const pull = (1 - d / (rad * 2.2)) * 900 + 100;
        p.x += (P.x - p.x) / d * pull * dt; p.y += (P.y - p.y) / d * pull * dt;
      }
      if (d < P.r + 10) {
        run.coins += p.val; run.coinsEarned += p.val; SFX.play('coin');
        floatText(p.x, p.y - 10, '+' + p.val, '#ffe14d', 12);
        room.pickups.splice(i, 1);
      }
    } else if (p.type === 'weapon') {
      p.t = (p.t || 0) + dt;
    }
  }
}

function findInteract() {
  let best = null, bd = 64 * 64;
  if (P.hackCd <= 0) {
    let hb = null, hd = 90 * 90;
    for (const e of room.enemies) { if (!canHack(e)) continue; const dd = d2(e.x, e.y, P.x, P.y); if (dd < hd) { hd = dd; hb = e; } }
    if (hb) return { label: `[E] 해킹: ${(ENEMY_INFO[hb.type] || { name: '분열 조각' }).name}`, act: () => { hackEnemy(hb); P.hackCd = 8; } };
  }
  for (const p of room.pickups) {
    if (p.type !== 'weapon') continue;
    const dd = d2(p.x, p.y, P.x, P.y);
    if (dd < bd) { bd = dd; best = { label: `[E] 줍기: ${weaponName(p.w)}`, act: () => pickupWeapon(p) }; }
  }
  for (const p of room.props) {
    if (p.dead || !p.interact) continue;
    const dd = d2(p.x, p.y, P.x, P.y);
    if (dd < (bd) && dd < (p.r + 50) ** 2) { bd = dd; best = { label: p.interact, act: () => interactProp(p) }; }
  }
  return best;
}
function pickupWeapon(p) {
  const idx = room.pickups.indexOf(p); if (idx < 0) return;
  room.pickups.splice(idx, 1);
  codex('weapon', p.w.id);
  if (run.weapons.length < 2) { run.weapons.push(p.w); run.cur = run.weapons.length - 1; }
  else {
    const old = run.weapons[run.cur];
    old.reloadT = 0;
    run.weapons[run.cur] = p.w;
    room.pickups.push({ type: 'weapon', x: P.x, y: P.y + 20, w: old, t: 0 });
  }
  p.w.first = true;
  SFX.play('pick');
  floatText(P.x, P.y - 36, weaponName(p.w), GRADES[p.w.grade].color, 16);
}

// ================= 플레이어가 밟은 환경 =================
function playerHazards() {
  const r = { slick: false, slow: 1, px: 0, py: 0 };
  for (const h of room.hazards) {
    if (!pointInHazard(h, P.x, P.y)) continue;
    switch (h.type) {
      case 'slick': r.slick = true; break;
      case 'frost': r.slick = true; P.chillT = Math.max(P.chillT, 0.3); if (h.dmg) damagePlayer(h.dmg, null); break;
      case 'oil': r.slow = Math.min(r.slow, 0.85); break;
      case 'fire': if (!h.player) damagePlayer(6, null); break;
      case 'toxic': damagePlayer(5, null); break;
      case 'water': if (h.elecT > 0 && !h.player) damagePlayer(8, null); if (run.char === 'marin') r.slow = Math.max(r.slow, 1.25); break;
      case 'steam': if (h.on) { P.chillT = Math.max(P.chillT, 1); damagePlayer(4, null); } break;
      case 'elecfloor': if (h.state === 'on') damagePlayer(10, null); break;
      case 'laser': if (h.state === 'on') damagePlayer(15, null); break;
      case 'conveyor': r.px += h.dx * 140; r.py += h.dy * 140; break;
    }
  }
  return r;
}

// ================= 카메라 =================
function updateCamera(dt, snap) {
  let tx = P.x - VW / 2, ty = P.y - VH / 2;
  if (!Input.usingPad && !Input.touch) { tx += (Input.mx - VW / 2) * 0.18; ty += (Input.my - VH / 2) * 0.18; }
  else { tx += Math.cos(P.ang) * 60; ty += Math.sin(P.ang) * 60; }
  const m = 80;
  if (room.w + m * 2 <= VW) tx = room.w / 2 - VW / 2; else tx = clamp(tx, -m, room.w + m - VW);
  if (room.h + m * 2 <= VH) ty = room.h / 2 - VH / 2; else ty = clamp(ty, -m, room.h + m - VH);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { cam.x = lerp(cam.x, tx, Math.min(1, 8 * dt)); cam.y = lerp(cam.y, ty, Math.min(1, 8 * dt)); }
}

// 조준 보조: 조준 방향 근처(원뿔 안)에서 가장 가까운 적. 벽 너머는 제외.
function assistTarget(ang, cone, range = 650) {
  let best = null, bs = 1e9;
  for (const e of room.enemies) {
    if (e.dead || e.spawning || e.invuln) continue;
    const d = dist(P.x, P.y, e.x, e.y); if (d > range) continue;
    const ad = Math.abs(angDiff(ang, angTo(P.x, P.y, e.x, e.y))); if (ad > cone) continue;
    if (rayWalls(P.x, P.y, e.x - P.x, e.y - P.y, d) < d - e.r) continue;
    const sc = d * (1 + ad * 3);
    if (sc < bs) { bs = sc; best = e; }
  }
  return best;
}
// ================= 그리기 보조 =================
function circlePath(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function polyPath(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; if (i) ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
function neonShape(c, lw = 2.2, fill = 'rgba(12,8,22,0.9)') {
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = c; ctx.globalAlpha = 0.28; ctx.lineWidth = lw * 3.4; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = lw; ctx.stroke();
}
function neonLine(x1, y1, x2, y2, c, lw = 2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = c; ctx.globalAlpha = 0.3; ctx.lineWidth = lw * 3; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = lw; ctx.stroke();
}
function gunBarrel(e, len, w, c, a = e.ang) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(a);
  ctx.fillStyle = c; ctx.fillRect(e.r * 0.4, -w / 2, len, w);
  ctx.restore();
}

// ================= 적 이동 보조 =================
function moveDir(e, a, spd, dt) { e.x += Math.cos(a) * spd * dt; e.y += Math.sin(a) * spd * dt; }
function moveToward(e, tx, ty, spd, dt) {
  let a = angTo(e.x, e.y, tx, ty);
  const look = e.r + 16;
  if (wallAt(e.x + Math.cos(a) * look, e.y + Math.sin(a) * look)) {
    if (!e.avoid) e.avoid = Math.random() < 0.5 ? 1 : -1;
    for (const k of [0.8, 1.6, 2.4]) { const na = a + k * e.avoid; if (!wallAt(e.x + Math.cos(na) * look, e.y + Math.sin(na) * look)) { a = na; break; } }
    e.avoidT = 0.5;
  } else if (e.avoidT > 0) e.avoidT -= dt; else e.avoid = 0;
  moveDir(e, a, spd, dt);
  e.mang = a;
}
function eTarget(e) {
  if (e.ally) return e.allyTarget || P;
  for (const a of room.allies) if (a.type === 'decoy' && d2(a.x, a.y, e.x, e.y) < 520 * 520) return a;
  for (const h of room.hacked) if (!h.dead && d2(h.x, h.y, e.x, e.y) < 220 * 220 && d2(h.x, h.y, e.x, e.y) < d2(P.x, P.y, e.x, e.y)) return h;
  if (e.objTarget && room.objProp && !room.objProp.dead) return room.objProp;
  return P;
}
function lob(e, tx, ty, time, aoe, dmg, debris) {
  spawnBullet({ x: e.x, y: e.y, team: e.ally ? 'p' : 'e', type: 'lob', tx, ty, life: time, aoe, dmg, r: 9, color: '#ff7a3b', owner: e, noWall: true, debris });
}
function rollMuts(n) { return rshuffleM(ELITE_IDS.slice()).slice(0, n); }
function rshuffleM(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================= 적 생성 =================
function spawnEnemy(type, x, y, o = {}) {
  const def = EN[type];
  const e = {
    type, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, hp: def.hp * G.eHp * (o.hpMult || 1), maxHp: 0, spd: def.spd * G.eSpd, color: def.color,
    contact: def.contact || 0, t: 0, st: '', cd: rand(0.8, 1.8), ang: 0, mang: 0, flash: 0, dead: false, muts: null, elite: null,
    burnT: 0, burnDps: 0, burnStacks: 0, burnTick: 0, shockT: 0, chill: 0, chillT: 0, frozenT: 0,
    shred: 0, shredT: 0, blindT: 0, dazzleT: 0, corrode: 0, corrodeT: 0, soakT: 0, gustT: 0, gustDmg: 0,
    poison: 0, poisonT: 0, poisonTick: 0, echoT: 0, echoAcc: 0, resT: 0, stasisT: 0,
    alert: 0, heavy: !!def.heavy, boss: !!def.boss, spawning: !o.instant, spawnT: o.instant ? 0 : 0.75,
    atkMult: 1, sm: 1, heldCoins: 0, noReward: !!o.noReward, hzT: 0, objHitT: 0, clone: !!o.clone, objTarget: !!o.objTarget, flying: !!def.flying
  };
  e.maxHp = e.hp;
  if (o.muts && o.muts.length) {
    e.muts = o.muts; e.elite = o.muts[0];
    e.r *= 1.35; e.hp *= 2.6; e.maxHp = e.hp; e.contact *= 1.3;
    if (e.muts.includes('barrier')) e.barrier = e.maxHp * 0.5;
    e.cloneT = 5; e.refT = 3; e.toxT = 0; e.clones = 0;
  }
  if (run && run.weapons.length && curW().mods.includes('silencer')) e.alert = 2.5;
  if (def.init) def.init(e, o);
  room.enemies.push(e);
  if (!o.instant && (type === 'tele' || type === 'mimic')) SFX.play('warn');
  if (!e.boss && ENEMY_INFO[type]) codex('enemy', type);
  return e;
}

// ================= 적 갱신 =================
function updateEnemies(dt) {
  const ens = room.enemies;
  for (let i = 0; i < ens.length; i++) {
    const e = ens[i];
    if (e.dead) continue;
    if (e.spawning) { e.spawnT -= dt; if (e.spawnT <= 0) e.spawning = false; continue; }
    let edt = dt;
    if (inSlowField(e.x, e.y)) edt *= 0.3;
    e.flash -= dt;
    // 상태 이상
    if (e.burnT > 0) {
      e.burnT -= edt; e.burnTick -= edt;
      if (e.burnT <= 0) e.burnStacks = 0;
      if (e.burnTick <= 0) {
        e.burnTick = BS.burnTick;
        damageEnemy(e, e.burnDps * BS.burnTick * (e.burnStacks || 1), { quiet: true, dot: true });
        if (e.dead) continue;
        if (BS.fire7 && Math.random() < 0.1) { const t = room.enemies.find(q => q !== e && !q.dead && !q.spawning && !(q.burnT > 0) && d2(q.x, q.y, e.x, e.y) < 120 * 120); if (t) applyStatus(t, 'fire', {}); }
      }
      if (Math.random() < 0.9 * PFX()) part({ x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r, e.r) * 0.5, vx: rand(-15, 15), vy: -rand(40, 95), life: 0.55, size: rand(3, 6), color: pick(['#ff6a1a', '#ffb347', '#ffe14d']), kind: 'dot' });
    }
    if (e.shockT > 0) { e.shockT -= edt; if (Math.random() < 0.08) addBolt(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r), e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r), '#fff04d', 0.06); }
    if (e.chillT > 0) { e.chillT -= edt; if (e.chillT <= 0) e.chill = 0; }
    if (e.shredT > 0) { e.shredT -= edt; if (e.shredT <= 0) e.shred = 0; }
    if (e.corrodeT > 0) { e.corrodeT -= edt; if (e.corrodeT <= 0) e.corrode = 0; }
    if (e.blindT > 0) e.blindT -= edt;
    if (e.dazzleT > 0) e.dazzleT -= edt;
    if (e.soakT > 0) { e.soakT -= edt; if (Math.random() < 0.06) part({ x: e.x + rand(-e.r, e.r), y: e.y, vx: 0, vy: 40, life: 0.4, size: 2.5, color: '#5aa0ff', kind: 'dot' }); }
    const hzSlow = e.boss ? 1 : enemyHazards(e, edt);
    if (e.dead) continue;
    e.sm = ((e.chill > 0 || e.chillT > 0) ? 1 - BS.chillSlow : 1) * hzSlow;
    if (e.muts) { if (e.muts.includes('haste')) e.sm *= 2; updateElite(e, edt); }
    if (e.poisonT > 0) {
      e.poisonT -= edt; e.poisonTick -= edt;
      if (e.poisonTick <= 0) { e.poisonTick = 0.5; poisonTick(e); if (e.dead) continue; }
      if (e.poisonT <= 0) e.poison = 0;
    }
    if (e.echoT > 0) { e.echoT -= edt; if (e.echoT <= 0) { echoBurst(e); if (e.dead) continue; } }
    if (e.resT > 0) e.resT -= edt;
    e.atkMult = (e.muts && e.muts.includes('rage') && e.hp < e.maxHp * 0.5 ? 2 : 1) * (e.dazzleT > 0 ? 0.6 : 1) * (e.poisonT > 0 && BS.neuro ? 0.7 : 1);
    if (e.frozenT > 0 || e.stasisT > 0) {
      if (e.frozenT > 0) e.frozenT -= edt;
      if (e.stasisT > 0) e.stasisT -= edt;
    } else if (e.blindT > 0 && !e.boss) {
      // 실명: 공격하지 못하고 헤맨다
      e.t += edt; moveDir(e, Math.sin(e.t * 1.3 + e.y * 0.01) * TAU, e.spd * 0.45 * e.sm, edt);
    } else if (e.alert > 0) {
      e.alert -= edt;
      if (d2(e.x, e.y, P.x, P.y) < 220 * 220) e.alert = 0;
      e.t += edt; moveDir(e, Math.sin(e.t * 0.7 + e.x) * TAU, e.spd * 0.25, edt);
    } else {
      if (e.bounty) bountyAI(e, edt); else EN[e.type].update(e, edt);
      if (e.dead) continue;
    }
    // 넉백 (+ 바람: 벽 충돌)
    e.x += e.kx * edt; e.y += e.ky * edt;
    if (e.gustT > 0) {
      e.gustT -= edt;
      const hitWall = (!e.flying && wallCircle(e.x, e.y, e.r)) || e.x <= e.r || e.x >= room.w - e.r || e.y <= e.r || e.y >= room.h - e.r;
      if (hitWall && Math.hypot(e.kx, e.ky) > 70) { slamEnemy(e); e.kx *= -0.3; e.ky *= -0.3; if (e.dead) continue; }
    }
    e.kx -= e.kx * Math.min(1, 9 * edt); e.ky -= e.ky * Math.min(1, 9 * edt);
    if (!e.flying) pushOutWalls(e);
    e.x = clamp(e.x, e.r, room.w - e.r); e.y = clamp(e.y, e.r, room.h - e.r);
    if (EN[e.type].post) EN[e.type].post(e, edt);
    // 접촉 피해
    if (e.contact && !P.dead && e.frozenT <= 0 && !(e.blindT > 0) && d2(e.x, e.y, P.x, P.y) < (e.r + P.r - 2) ** 2) damagePlayer(e.contact, e);
    if (room.objProp && !room.objProp.dead && e.contact && !(e.blindT > 0) && d2(e.x, e.y, room.objProp.x, room.objProp.y) < (e.r + room.objProp.r) ** 2) {
      e.objHitT -= edt; if (e.objHitT <= 0) { e.objHitT = 0.6; hitAllyProp(room.objProp, e.contact); }
    }
  }
  // 겹침 밀어내기
  for (let i = 0; i < ens.length; i++) {
    const a = ens[i]; if (a.dead || a.spawning) continue;
    for (let j = i + 1; j < ens.length; j++) {
      const b = ens[j]; if (b.dead || b.spawning) continue;
      const dx = b.x - a.x, dy = b.y - a.y, mr = a.r + b.r, dd = dx * dx + dy * dy;
      if (dd < mr * mr && dd > 0.01) {
        const d = Math.sqrt(dd), push = (mr - d) / 2, nx = dx / d, ny = dy / d;
        // 바람 7세트: 밀려난 적끼리 부딪히면 둘 다 충돌 피해
        if (BS.crash && ((a.gustT > 0 && !a.crashed) || (b.gustT > 0 && !b.crashed))) {
          const src = a.gustT > 0 ? a : b, other = src === a ? b : a;
          src.crashed = true; other.gustDmg = Math.max(other.gustDmg || 0, src.gustDmg); other.gustT = Math.max(other.gustT, 0.01);
          slamEnemy(src, 0.7); if (!other.dead) slamEnemy(other, 0.7);
        }
        const aw = a.heavy || a.boss ? 0 : 1, bw = b.heavy || b.boss ? 0 : 1, tw = aw + bw;
        if (tw === 0) continue;
        a.x -= nx * push * 2 * aw / tw; a.y -= ny * push * 2 * aw / tw;
        b.x += nx * push * 2 * bw / tw; b.y += ny * push * 2 * bw / tw;
      }
    }
  }
  for (let i = ens.length - 1; i >= 0; i--) if (ens[i].dead) ens.splice(i, 1);
}

function updateElite(e, dt) {
  const m = e.muts;
  if (m.includes('clone') && !e.clone) {
    e.cloneT -= dt;
    if (e.cloneT <= 0) {
      e.cloneT = 5;
      if (e.clones < 4 && room.enemies.length < 90) {
        const c = spawnEnemy(e.type, clamp(e.x + rand(-30, 30), 20, room.w - 20), clamp(e.y + rand(-30, 30), 20, room.h - 20), { clone: true, noReward: true, hpMult: 0.3 });
        e.clones++; c.color = '#9dff80';
      }
    }
  }
  if (m.includes('reflect')) { e.refT -= dt; if (e.refT <= 0) e.refT = 3; e.reflectOn = e.refT < 1; }
  if (m.includes('toxic')) { e.toxT -= dt; if (e.toxT <= 0) { e.toxT = 0.35; if (room.hazards.length < 120) addHazard({ type: 'toxic', x: e.x, y: e.y, r: 24, life: 4 }); } }
}

function enemyHazards(e, dt) {
  e.hzT -= dt;
  let slow = 1;
  const tick = e.hzT <= 0;
  for (const h of room.hazards) {
    if (h.type === 'slick' || h.type === 'frost' || h.type === 'toxic') continue;
    if (!pointInHazard(h, e.x, e.y)) continue;
    switch (h.type) {
      case 'fire': if (tick) applyStatus(e, 'fire', {}); break;
      case 'water':
        if (tick) { if (h.elecT > 0) { applyStatus(e, 'elec', { noChain: true }); damageEnemy(e, 6, { quiet: true, dot: true }); } else if (!(e.soakT > 0)) applyStatus(e, 'water', {}); }
        break;
      case 'scald': if (tick) damageEnemy(e, h.dmg || 8, { quiet: true, dot: true }); break;
      case 'shadow': if (tick) applyStatus(e, 'dark', {}); break;
      case 'venom': if (tick) applyStatus(e, 'poison', {}); break;
      case 'elecfloor': if (h.state === 'on' && tick) { damageEnemy(e, 15, { quiet: true, dot: true }); applyStatus(e, 'elec', { noChain: true }); } break;
      case 'laser': if (h.state === 'on' && tick) damageEnemy(e, 20, { quiet: true, dot: true }); break;
      case 'steam': if (h.on && tick) applyStatus(e, 'ice', {}); break;
      case 'frostfloor': if (tick) applyStatus(e, 'ice', {}); break;
      case 'conveyor': if (!e.heavy) { e.x += h.dx * 140 * dt; e.y += h.dy * 140 * dt; } break;
      case 'oil': slow = 0.85; break;
    }

  }
  if (tick) e.hzT = 0.5;
  return slow;
}

// ================= 해킹된 아군 갱신 =================
function updateHacked(dt) {
  for (let i = room.hacked.length - 1; i >= 0; i--) {
    const h = room.hacked[i];
    if (h.dead) { room.hacked.splice(i, 1); continue; }
    h.allyT -= dt; h.flash -= dt;
    if (h.allyT <= 0 || room.done) {
      room.hacked.splice(i, 1); h.dead = true;
      if (!room.done) explode(h.x, h.y, 90, 30, { noSelf: true });
      else burst(h.x, h.y, '#29f0ff', 16, 200, 0.4, 3);
      continue;
    }
    let best = null, bd = 900 * 900;
    for (const e of room.enemies) { if (e.dead || e.spawning) continue; const dd = d2(e.x, e.y, h.x, h.y); if (dd < bd) { bd = dd; best = e; } }
    h.allyTarget = best;
    h.sm = 1.2; h.atkMult = 1.3;
    if (best) EN[h.type].update(h, dt);
    else moveToward(h, P.x + 40, P.y + 40, h.spd, dt);
    if (h.dead) continue;
    h.x += h.kx * dt; h.y += h.ky * dt;
    h.kx -= h.kx * Math.min(1, 9 * dt); h.ky -= h.ky * Math.min(1, 9 * dt);
    if (!h.flying) pushOutWalls(h);
    h.x = clamp(h.x, h.r, room.w - h.r); h.y = clamp(h.y, h.r, room.h - h.r);
    if (EN[h.type].post) EN[h.type].post(h, dt);
    h.contactCd -= dt;
    if (h.contactCd <= 0) for (const e of room.enemies) {
      if (e.dead || e.spawning || d2(e.x, e.y, h.x, h.y) > (e.r + h.r + 2) ** 2) continue;
      h.contactCd = 0.45;
      damageEnemy(e, Math.max(8, h.contact * 1.6) * BS.dmgMult, { knock: 120, ang: angTo(h.x, h.y, e.x, e.y) });
      break;
    }
  }
}
// ================= 보스 =================
function bossDraw(e, c, f, fn) {
  if (SAVE.settings.particles > 0) { ctx.shadowColor = e.color; ctx.shadowBlur = 20; }
  fn();
  ctx.shadowBlur = 0;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

// 보스 방 준비: 사물 배치 + 보스 생성
function setupBoss(id) {
  const cx = room.w / 2, cy = room.h / 2;
  room.bossId = id;
  codex('boss', id);
  if (id === 'crusher') {
    spawnEnemy('boss_crusher', cx, cy - 150, { instant: true });
  } else if (id === 'frost') {
    const hx = Math.min(room.w * 0.36, 520), hy = Math.min(room.h * 0.36, 330);
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) room.props.push({ type: 'heater', x: cx + sx * hx, y: cy + sy * hy, r: 22, hp: 20, maxHp: 20, shootable: true, on: false });
    spawnEnemy('boss_frost', cx, cy, { instant: true });
  } else if (id === 'twins') {
    room.twins = [spawnEnemy('boss_twins', cx - 250, cy, { instant: true, idx: 0 }), spawnEnemy('boss_twins', cx + 250, cy, { instant: true, idx: 1 })];
    room.twinAng = Math.PI; room.twinR = 250; room.twinDir = 1; room.twinRT = 5;
  } else if (id === 'mother') {
    spawnEnemy('boss_mother', cx, 240, { instant: true });
  }
  const info = BOSS_INFO[id];
  G.bossIntro = { t: 2.6, max: 2.6, name: info.name, sub: info.sub };
  SFX.play('boss');
}

function spawnPillars(n) {
  const cx = room.w / 2, cy = room.h / 2 + 60;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i + 0.5) / n * TAU + 0.3;
    const x = clamp(cx + Math.cos(a) * 360, 80, room.w - 80), y = clamp(cy + Math.sin(a) * 280, 80, room.h - 80);
    room.props.push({ type: 'spillar', x, y, r: 26, hp: 170 * G.bossHp, maxHp: 170 * G.bossHp, shootable: true, shootT: rand(1.5, 3) });
    burst(x, y, '#c86bff', 20, 250, 0.5, 3);
  }
}

function onBossKilled(e) {
  if (room.enemies.some(b => b.boss && !b.dead && b !== e)) return;
  run.bossesKilled++;
  SAVE.stats.bossKills = (SAVE.stats.bossKills || 0) + 1;

  for (const m of room.enemies) if (!m.dead && !m.boss) { m.noReward = true; killEnemy(m, {}); }
  for (const b of BULLETS) if (b.team === 'e') b.dead = true;
  room.props = room.props.filter(p => p.type !== 'spillar' && p.type !== 'heater');
  room.hazards = room.hazards.filter(h => !h.boss); // 보스가 만든 얼음 바닥 제거 (아레나에서 계속 남던 문제)

}

      if (room.walls.some(o => x < o.x + o.w + 70 && x + w + 70 > o.x && y < o.y + o.h + 70 && y + h + 70 > o.y)) continue;
      const debris = z === 0 && Math.random() < 0.45;

      break;
    }
  }
  const spot = (r, d) => freeSpot(r, d || 240, 60, band ? (x, y) => Math.abs(y - H / 2) > r + 60 : null);
  const puddle = (type, n, r0, r1) => { for (let i = 0; i < n; i++) { const r = rand(r0, r1); const s = freeSpot(r, 200, 40); if (s) addHazard({ type, x: s.x, y: s.y, r }); } };
  if (z === 0) {

  } else if (z === 1) {

    puddle('water', randi(3, 4), 60, 100);
    puddle('oil', 1, 50, 80);
    for (let i = 0; i < 3; i++) { const s = freeSpot(80, 280, 40); if (s) addHazard({ type: 'steam', x: s.x, y: s.y, r: 80, cycle: [rand(2.5, 4), 0.8, 1.3], state: 'off', ct: rand(0, 3) }); }
    for (let i = 0; i < 2; i++) { const s = spot(16); if (s) room.props.push({ type: 'barrel', x: s.x, y: s.y, r: 15, hp: 20, shootable: true }); }
  } else if (z === 2) {
    for (let i = 0; i < randi(3, 5); i++) {
      for (let k = 0; k < 30; k++) {
        const w = rand(140, 230), h = rand(140, 230), x = rand(60, W - 60 - w), y = rand(60, H - 60 - h);
        if (circleRect(room.sx, room.sy, 180, { x, y, w, h })) continue;
        if (room.hazards.some(o => o.shape === 'r' && x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y)) continue;
        addHazard({ type: 'elecfloor', shape: 'r', x, y, w, h, cycle: [rand(2.5, 3.5), 0.9, 1.6], state: 'off', ct: rand(0, 3) });
        break;
      }
    }
    for (let i = 0; i < randi(1, 2); i++) { const s = spot(22, 300); if (s) room.props.push({ type: 'pgen', x: s.x, y: s.y, r: 22, hp: 60, shootable: true }); }
    for (let i = 0; i < randi(2, 3); i++) {
      const horiz = Math.random() < 0.5, w = horiz ? rand(240, 340) : 70, h = horiz ? 70 : rand(240, 340);
      const x = rand(60, W - 60 - w), y = rand(60, H - 60 - h);
      if (circleRect(room.sx, room.sy, 150, { x, y, w, h })) continue;

      const x = rand(80, W - 80 - w), y = rand(80, H - 80 - h);

    for (let i = 0; i < 2; i++) { const s = spot(16, 300); if (s) room.props.push({ type: 'hturret', x: s.x, y: s.y, r: 16, ang: 0, cd: 1.5, hacked: false, interact: '[E] 포탑 해킹' }); }
