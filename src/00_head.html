<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오버클럭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07060d;--cy:#29f0ff;--mg:#ff3df0;--ye:#ffe14d;--or:#ff8a2a;--rd:#ff2d55;--tx:#e8ecff;--mu:#8a90b0;--pn:rgba(14,12,30,.94);--bd:#2e2a55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:70px 16px 24px;overflow-y:auto;background:rgba(5,4,12,.74);cursor:default}
.scr.top{justify-content:flex-start}
.scr.clear{background:rgba(5,4,12,.35)}
.logo{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:clamp(56px,11vw,136px);letter-spacing:4px;color:#fff;text-shadow:0 0 10px var(--cy),0 0 30px var(--cy),0 0 70px var(--mg);line-height:1;animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}97%{opacity:.6}}
.logo-en{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:14px;color:var(--mg);text-shadow:0 0 12px var(--mg);margin:10px 0 30px;font-size:clamp(14px,2.4vw,24px)}
h2{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 14px var(--cy);text-align:center}
h3{font-weight:900}
.sub{color:var(--mu);margin-bottom:18px;font-size:14px;text-align:center;line-height:1.6}
.btn{font-family:inherit;font-weight:700;font-size:16px;color:var(--tx);background:rgba(20,18,42,.92);border:1.5px solid var(--cy);padding:11px 22px;min-width:220px;margin:5px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:background .1s,color .1s;box-shadow:inset 0 0 14px rgba(41,240,255,.15)}
.btn:hover:not(:disabled){background:var(--cy);color:#05040c}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{min-width:0;padding:7px 14px;font-size:13px}
.btn.mg{border-color:var(--mg);box-shadow:inset 0 0 14px rgba(255,61,240,.15)}.btn.mg:hover:not(:disabled){background:var(--mg)}
.btn.ye{border-color:var(--ye)}.btn.ye:hover:not(:disabled){background:var(--ye)}
.btn.rd{border-color:var(--rd)}.btn.rd:hover:not(:disabled){background:var(--rd);color:#fff}
.btn.on{background:var(--cy);color:#05040c}
.col{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.card{width:236px;background:var(--pn);border:1.5px solid var(--bd);padding:16px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;text-align:left}
.card:hover{transform:translateY(-4px);border-color:var(--cy);box-shadow:0 0 22px rgba(41,240,255,.35)}
.card.nohover{cursor:default}.card.nohover:hover{transform:none;box-shadow:none;border-color:var(--bd)}
.card.rare{border-color:#4db8ff}.card.legend{border-color:#ffb52e;box-shadow:0 0 14px rgba(255,181,46,.3)}
.card.curse{border-color:var(--rd);box-shadow:0 0 18px rgba(255,45,85,.45);background:rgba(40,6,16,.94)}
.card.locked{opacity:.45;cursor:not-allowed}.card.locked:hover{transform:none}
.card.sel{border-color:var(--ye);box-shadow:0 0 22px rgba(255,225,77,.5)}
.card h3{font-size:19px;margin-bottom:4px}
.card p{font-size:13px;color:#c5cae6;line-height:1.55}
.card .rib{position:absolute;top:8px;right:10px;font-size:11px;font-weight:900;letter-spacing:1px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:3px;margin:2px 3px 2px 0;color:#05040c;vertical-align:middle}
.muted{color:var(--mu)}.small{font-size:12px}.big{font-size:20px}
.coin{color:var(--ye);font-weight:700}
.panel{background:var(--pn);border:1px solid var(--bd);padding:14px 18px;margin:6px}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:linear-gradient(rgba(0,0,0,.8),transparent);font-size:14px;gap:12px;flex-wrap:wrap;z-index:2}
.topbar b{font-weight:900}
.hpbar{display:inline-block;width:120px;height:10px;background:#301020;border:1px solid #ff4d6d;vertical-align:middle;margin-left:6px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff7a8a)}
.map{position:relative;width:min(780px,94vw);height:max(420px,min(640px,68vh));margin-top:8px;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:2px solid #4a4670;background:#12102a;display:flex;align-items:center;justify-content:center;font-size:21px;transition:transform .12s;color:#fff;cursor:default}
.node.avail{cursor:pointer;animation:pulse .9s infinite alternate;border-color:var(--cy)}
.node.avail:hover{transform:scale(1.2)}
.node.done{opacity:.35}.node.cur{border-color:var(--ye);box-shadow:0 0 18px var(--ye)}
.node.boss{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:32px;border-color:var(--mg)}
.node .nl{position:absolute;top:100%;margin-top:3px;font-size:11px;white-space:nowrap;color:var(--mu);pointer-events:none}
@keyframes pulse{from{box-shadow:0 0 4px var(--cy)}to{box-shadow:0 0 22px var(--cy)}}
.radio{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(740px,92vw);background:rgba(8,6,22,.97);border:1px solid var(--cy);box-shadow:0 0 20px rgba(41,240,255,.25);padding:12px 18px 14px;font-size:15px;line-height:1.6;min-height:74px;pointer-events:auto;cursor:pointer;z-index:4}
.radio::before{content:'◉ 무전  —  클릭 / 스페이스로 넘기기';color:var(--mg);font-size:11px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.tabs .btn{min-width:0;padding:7px 14px;font-size:13px}
.list{width:min(960px,94vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.list .card{width:auto}
.scr>*{flex-shrink:0}
@media (max-width:900px),(max-height:760px),(pointer:coarse){.list{max-height:none;overflow:visible}}
.scr{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-size:15px}
.kv span:nth-child(odd){color:var(--mu)}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:24px;text-shadow:0 0 10px #000,0 0 4px #000;text-align:center;transition:opacity .3s}
input[type=range]{width:200px;accent-color:var(--cy)}
.hint{color:var(--mu);font-size:12px;margin-top:14px;text-align:center;line-height:1.7}
.slot{display:inline-block;width:14px;height:14px;border:1px solid #888;margin-left:3px;vertical-align:middle;border-radius:2px}
.slot.f{background:var(--cy);border-color:var(--cy)}
.charcard{width:210px;min-height:280px}
.chargrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(760px,94vw)}
.ctile{background:var(--pn);border:1.5px solid var(--bd);padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ctile .cdot{width:26px;height:26px;border-radius:50%;border:3px solid var(--cc);box-shadow:0 0 10px var(--cc);margin-bottom:2px}
.ctile b{color:var(--cc);font-size:14px}.ctile span{font-size:11px;color:var(--mu)}
.ctile.sel{border-color:var(--cc);box-shadow:0 0 14px var(--cc)}.ctile.locked{opacity:.45}
.cdetail{width:min(760px,94vw);line-height:1.6;font-size:14px;margin-top:8px}.cdetail p{margin-top:4px}
@media(max-width:520px){.chargrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.charcard .av{width:64px;height:64px;border-radius:50%;margin-bottom:10px;box-shadow:0 0 18px currentColor;border:3px solid currentColor}
.ocsel{display:flex;align-items:center;gap:10px;margin:14px 0}
.ocsel b{font-family:'Orbitron';font-size:22px;color:var(--mg);min-width:40px;text-align:center}
.evbox{width:min(640px,94vw);text-align:center}
.evbox .desc{font-size:16px;line-height:1.8;margin:10px 0 18px;color:#d6daf0}
table.tb{border-collapse:collapse;font-size:13px}
table.tb td{padding:3px 10px;border-bottom:1px solid #22203f}
.btn:focus-visible,.card:focus-visible,.node:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.logo,.node.avail{animation:none}}

.cut{position:absolute;inset:0;background:#05030a;cursor:pointer;pointer-events:auto;overflow:hidden;animation:cutin .9s ease-out}
.cut.out{opacity:0;transition:opacity .6s}
@keyframes cutin{from{opacity:0}to{opacity:1}}
#cutCv{position:absolute;inset:0;width:100%;height:100%}
.cut-bar{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:2}
.cut-bar.top{top:0;animation:barT 1.2s ease-out}.cut-bar.bot{bottom:0;animation:barB 1.2s ease-out}
@keyframes barT{from{transform:translateY(-100%)}to{transform:none}}@keyframes barB{from{transform:translateY(100%)}to{transform:none}}
.cut-skip{position:absolute;top:calc(11vh + 10px);right:16px;z-index:5;font-family:inherit;font-size:13px;font-weight:700;color:#c5cae6;background:rgba(6,5,16,.7);border:1px solid #4a4670;padding:8px 14px;cursor:pointer}
.cut-skip:hover,.cut-skip:focus-visible{background:#29f0ff;color:#05040c;border-color:#29f0ff;outline:none}
.cut-title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:opacity 1s;animation:titlein 1.6s ease-out}
.cut-title.hide{opacity:0;pointer-events:none}
.cut-title small{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:#ff3df0;font-size:13px}
.cut-title b{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:clamp(40px,9vw,84px);color:#fff;text-shadow:0 0 14px #c86bff,0 0 40px #ff3df0;letter-spacing:4px}
.cut-title span{color:#c5cae6;letter-spacing:.3em;font-size:14px}
@keyframes titlein{from{opacity:0;transform:scale(1.15);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.cut-box{position:absolute;left:50%;bottom:calc(11vh + 18px);transform:translateX(-50%);width:min(860px,92vw);z-index:3;background:rgba(6,4,16,.82);border:1.5px solid var(--cc,#29f0ff);box-shadow:0 0 24px color-mix(in srgb,var(--cc,#29f0ff) 35%,transparent);padding:14px 20px 12px;min-height:96px;transition:opacity .4s;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.cut-box.narr{border-color:#4a4670;box-shadow:none;font-style:italic}
.cut-who{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:19px;letter-spacing:1px;margin-bottom:4px}
.cut-text{font-size:clamp(15px,2.4vw,18px);line-height:1.75;color:#eef0ff;min-height:3.5em}
.cut-hint{margin-top:6px;font-size:11px;color:#6a7096;text-align:right}
.cut-flash{position:absolute;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}
.cut-flash.go{animation:cflash .9s ease-out}
@keyframes cflash{0%{opacity:.95}100%{opacity:0}}
.cut.shake{animation:cshake .6s}
@keyframes cshake{0%,100%{transform:none}15%{transform:translate(-8px,5px)}30%{transform:translate(7px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,2px)}}
@media (prefers-reduced-motion:reduce){.cut,.cut-bar,.cut-title{animation:none!important}.cut.shake{animation:none}.cut-flash.go{animation:none}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a3570}
@media(max-width:640px){.card{width:100%}.btn{min-width:160px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="toast"></div>
<script>
